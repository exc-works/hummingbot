  uint32 yes_token = 1 [
    (gogoproto.jsontag) = "yes_token",
    (gogoproto.moretags) = "binding:\"required\""
  ];
  // 预测事件 ID
  uint64 event_id = 2 [
    (gogoproto.jsontag) = "event_id",
    (gogoproto.moretags) = "binding:\"required\""
  ];
}

// 策略实例变更订阅
message StrategySubscribeRequest {
  // 主账户地址，必填
  string master_account = 1 [(gogoproto.moretags) = "binding:\"required\""];
  // 交易域，可选。不传或为空时表示订阅该账户在所有交易域下的策略。
  // 取值：0=Perp, 1=Spot, 2=Prediction
  string trading_domain = 2;
}

// 策略实例变更推送通知
message StrategySubscribeNotification {
  // 变更后的策略实例快照
  strategy.StrategyResponse strategy = 1 [(gogoproto.nullable) = true];
}

// 预测市场成交更新通知
message PredictionSymbolTradeSubscribeNotification {
  // 预测事件 ID
  uint64 event_id = 1 [(gogoproto.jsontag) = "event_id"];
  // YES 结果代币 ID
  uint32 yes_token = 2 [(gogoproto.jsontag) = "yes_token"];
  // NO 结果代币 ID
  uint32 no_token = 3 [(gogoproto.jsontag) = "no_token"];
  // 成交方向。取值：LONG=买入, SHORT=卖出
  string side = 4 [
    (gogoproto.customtype) =
        "github.com/exc-works/caishen/share/schema.PositionSide",
    (gogoproto.nullable) = false
  ];
  // 成交数量
  string size = 5 [
    (gogoproto.customtype) = "github.com/exc-works/decimal.Decimal",
    (gogoproto.nullable) = false
  ];
  // 成交价格
  string price = 6 [
    (gogoproto.customtype) = "github.com/exc-works/decimal.Decimal",
    (gogoproto.nullable) = false
  ];
  // 时间戳（Unix 毫秒）
  int64 time = 7;
  // 交易哈希
  bytes tx_hash = 8 [
    (gogoproto.customtype) = "github.com/ethereum/go-ethereum/common.Hash",
    (gogoproto.nullable) = false
  ];
  // 本条成交对应的结果方向。取值：0=YES, 1=NO
  share.schema.PredictionOutcome outcome = 9 [(gogoproto.jsontag) = "outcome"];
}
