// 查询预测市场订单历史请求
message ListPredictionOrderHistoryRequest {
  // 账户地址
  string account = 1
      [(gogoproto.moretags) = "form:\"account\" binding:\"required\""];
  // YES Token 过滤，空字符串表示不过滤
  string yes_token = 2 [(gogoproto.moretags) = "form:\"yes_token\""];
  // 游标：第一页传空字符串；后续传上一页返回的 cursor
  string cursor = 3 [(gogoproto.moretags) = "form:\"cursor\""];
  // 每页数量，默认与上限均为 100
  uint64 limit = 4 [(gogoproto.moretags) = "form:\"limit\""];
  // 方向过滤：0=买入，1=卖出；空字符串表示不过滤
  string side = 5 [(gogoproto.moretags) = "form:\"side\""];
  // outcome 过滤：0=YES，1=NO；空字符串表示不过滤
  string outcome = 6 [(gogoproto.moretags) = "form:\"outcome\""];
}

// 查询预测市场订单历史响应
message ListPredictionOrderHistoryResponse {
  // 订单历史列表
  repeated PredictionOrderHistoryResponse history = 1;
  // 下一页游标，为 null 时表示无更多数据
  google.protobuf.StringValue cursor = 2 [
    (gogoproto.customtype) = "string",
    (gogoproto.nullable) = true,
    (gogoproto.jsontag) = "cursor"
  ];
}

// 查询预测市场资金流水请求
message ListPredictionTransactionsRequest {
  // 账户地址
  string account = 1
      [(gogoproto.moretags) = "form:\"account\" binding:\"required\""];
  // 游标：第一页传空字符串；后续传上一页返回的 cursor
  string cursor = 2 [(gogoproto.moretags) = "form:\"cursor\""];
  // 每页数量，默认与上限均为 100
  uint64 limit = 3 [(gogoproto.moretags) = "form:\"limit\""];
  // 流水类型过滤，可传多个值，不传或为空则不过滤。
  // 取值：2=拆分, 3=合并, 4=买入, 5=卖出, 15=结算
  repeated string tx_types = 4 [(gogoproto.moretags) = "form:\"tx_types\""];
  // outcome 过滤：0=YES，1=NO；空字符串表示不过滤
  string outcome = 5 [(gogoproto.moretags) = "form:\"outcome\""];
  // YES Token 过滤，空字符串表示不过滤
  string yes_token = 6 [(gogoproto.moretags) = "form:\"yes_token\""];
}

// 查询预测市场资金流水响应
message ListPredictionTransactionsResponse {
  // 资金流水列表
  repeated PredictionAccountLedgerHistoryResponse transactions = 1;
  // 下一页游标，为 null 时表示无更多数据
  google.protobuf.StringValue cursor = 2 [
    (gogoproto.customtype) = "string",
    (gogoproto.nullable) = true,
    (gogoproto.jsontag) = "cursor"
  ];
}

