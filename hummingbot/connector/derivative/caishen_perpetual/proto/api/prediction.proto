// 预测市场账户资金流水（单条）
message PredictionAccountLedgerHistoryResponse {
  // 事件 ID
  uint64 event_id = 1 [(gogoproto.jsontag) = "event_id"];
  // 所属市场的 YES Token ID
  uint32 yes_token_id = 2 [(gogoproto.jsontag) = "yes_token_id"];
  // 所属市场的 NO Token ID
  uint32 no_token_id = 3 [(gogoproto.jsontag) = "no_token_id"];
  // outcome：0=YES，1=NO；非成交/结算类流水为 null
  google.protobuf.Int32Value outcome = 4
      [(gogoproto.jsontag) = "outcome", (gogoproto.customtype) = "int32"];
  // 流水类型：1=充值, 2=拆分, 3=合并, 4=买入, 5=卖出, 6=提现, 7=提现手续费,
  // 8=提现失败, 9=转账接收, 10=转账发送, 11=跨域转账接收, 12=跨域转账发送,
  // 13=保证金罚没, 14=保证金分发, 15=结算
  int32 type = 5 [(gogoproto.jsontag) = "type"];
  // 交易时间，Unix 毫秒
  int64 traded_at = 6 [(gogoproto.jsontag) = "traded_at"];
  // 交易数量
  string size = 7 [
    (gogoproto.customtype) = "github.com/exc-works/decimal.Decimal",
    (gogoproto.nullable) = false
  ];
  // 交易价格
  string price = 8 [
    (gogoproto.customtype) = "github.com/exc-works/decimal.Decimal",
    (gogoproto.nullable) = false
  ];
  // USD 变化金额，可正可负
  string amount = 9 [
    (gogoproto.customtype) = "github.com/exc-works/decimal.Decimal",
    (gogoproto.nullable) = false
  ];
  // 变化后的钱包余额
  string wallet = 10 [
    (gogoproto.customtype) = "github.com/exc-works/decimal.Decimal",
    (gogoproto.nullable) = false
  ];
  // 发生变化的 Token ID
  uint32 token_id = 11 [(gogoproto.jsontag) = "token_id"];
  // 交易哈希
  bytes tx_hash = 12 [
    (gogoproto.customtype) = "github.com/ethereum/go-ethereum/common.Hash",
    (gogoproto.nullable) = false
  ];
  // 事件标题
  string event_title = 13 [(gogoproto.jsontag) = "event_title"];
  // 事件 slug
  string slug = 14 [(gogoproto.jsontag) = "slug"];
  // 事件图标 URL
  string icon = 15 [(gogoproto.jsontag) = "icon"];
  // 选项标题，仅多元事件（event_type=2）有效
  string outcome_title = 16 [(gogoproto.jsontag) = "outcome_title"];
  // 额外信息，按流水类型透传的原始 JSON 对象；无额外信息时省略。
  // 各类型的字段结构不同，仅部分类型（如买入、卖出、充值、提现、结算等）携带内容。
  // type=1 deposited（充值）示例：
  // {"chain_id":<uint64>,"deposit_hash":<string>,"idempotency_key":<string>}
  // chain_id：链 ID。
  // deposit_hash / idempotency_key：由 []byte 经 JSON 编码，表现为 base64
  // 字符串。 type=6 withdrew（提现）示例：
  // {"pending_id":<uint64>,"fee":<string>}
  // pending_id：提现 pending 记录 ID。fee：手续费（decimal 字符串）。
  // type=8 withdrew_rejected 示例：
  // {"pending_id":<uint64>,"reason":<string>}
  // type=11 transfer_account_in / type=12 transfer_account_out 示例：
  // {"from_domain":<int32>,"to_domain":<int32>}
  // type=4 bought / type=5 sold 示例：
  // {"taker":<bool>,"match_type":<int32>,"quote_amount":<string>,"quote_fee":<string>,"outcome_amount":<string>,"outcome_fee":<string>,"counter_outcome_fee":<string>}
  // quote_amount：该账户 USD 因本次成交的净变动（不含手续费）。
  // quote_fee：USD 净手续费；<0 支付，>0 返佣；以 outcome token 结算手续费时为
  // "0"。 outcome_amount：本方 outcome token (yes/no) 净变动（不含手续费）。
  // outcome_fee：本方 outcome token 净手续费；以 USD 结算时为 "0"。
  bytes extra = 17 [
    (gogoproto.customtype) = "encoding/json.RawMessage",
    (gogoproto.nullable) = false,
    (gogoproto.jsontag) = "extra,omitempty"
  ];
  // 账户地址
  bytes account = 18 [
    (gogoproto.customtype) =
        "github.com/exc-works/caishen/common/base.AccountId",
    (gogoproto.nullable) = false,
    (gogoproto.jsontag) = "account"
  ];
}

// 查询争议提案请求（event_id 与 yes_token 唯一确定一条争议记录）
message GetDisputeProposalRequest {
  // 事件 ID
  uint64 event_id = 1
      [(gogoproto.moretags) = "form:\"event_id\" binding:\"required\""];
  // YES Token ID
  uint32 yes_token = 2
      [(gogoproto.moretags) = "form:\"yes_token\" binding:\"required\""];
}

// 争议提案响应
message GetDisputeProposalResponse {
  // 争议提案记录；无记录时为 null
  DisputeProposalItem proposal = 1 [(gogoproto.jsontag) = "proposal"];
}

// 单条争议提案记录。
// 字段按争议生命周期逐步填充；nullable=true 的字段在对应阶段到达前为 null。
message DisputeProposalItem {
  // 争议状态：1=待处理, 2=创建提案中, 3=投票中, 4=提交裁决中, 5=分发保证金中,
  // 6=已结束
  int32 status = 1 [(gogoproto.jsontag) = "status"];
  // 关联的预测事件 ID
  uint64 event_id = 2 [(gogoproto.jsontag) = "event_id"];
  // 被争议的 YES Token ID
  uint32 yes_token = 3 [(gogoproto.jsontag) = "yes_token"];
  // 对应的 NO Token ID
  uint32 no_token = 4 [(gogoproto.jsontag) = "no_token"];

  // 提案人账户信息，始终有值
  AccountInfo proposer = 5
      [(gogoproto.nullable) = false, (gogoproto.jsontag) = "proposer"];
  // 提案人锁仓保证金金额
  string proposal_bond_amount = 6 [
    (gogoproto.customtype) = "github.com/exc-works/decimal.Decimal",
    (gogoproto.nullable) = false,
    (gogoproto.jsontag) = "proposal_bond_amount"
  ];
  // 争议截止时间，Unix 毫秒
  int64 dispute_deadline = 7 [(gogoproto.jsontag) = "dispute_deadline"];

  // 争议人账户信息；无人发起争议时为 null
  AccountInfo disputer = 8
      [(gogoproto.nullable) = true, (gogoproto.jsontag) = "disputer"];
  // 争议人锁仓保证金金额；无人发起争议时为 "0"
  string dispute_bond_amount = 9 [
    (gogoproto.customtype) = "github.com/exc-works/decimal.Decimal",
    (gogoproto.nullable) = false,
    (gogoproto.jsontag) = "dispute_bond_amount"
  ];

  // 投票提案 ID，带 0x 前缀的十六进制字符串；未创建提案时为空字符串
  string proposal_id = 10 [(gogoproto.jsontag) = "proposal_id"];
  // 投票开始时间，Unix 毫秒；未开始时为 0
  int64 vote_start_at = 11 [(gogoproto.jsontag) = "vote_start_at"];
  // 投票结束时间，Unix 毫秒；未结束时为 0
  int64 vote_end_at = 12 [(gogoproto.jsontag) = "vote_end_at"];

  // 赞成票总票权；未统计时为 "0"
  string vote_for = 13 [
    (gogoproto.customtype) = "github.com/exc-works/decimal.Decimal",
    (gogoproto.nullable) = false,
    (gogoproto.jsontag) = "vote_for"
  ];
  // 反对票总票权；未统计时为 "0"
  string vote_against = 14 [
    (gogoproto.customtype) = "github.com/exc-works/decimal.Decimal",
    (gogoproto.nullable) = false,
    (gogoproto.jsontag) = "vote_against"
  ];
  // 最终裁决胜出的 Token ID（YES Token 或 NO Token）；未裁决时为 0
  uint32 final_outcome = 15 [(gogoproto.jsontag) = "final_outcome"];

  // 裁决交易哈希；裁决完成前省略
  bytes resolve_tx_hash = 16 [
    (gogoproto.customtype) = "github.com/ethereum/go-ethereum/common.Hash",
    (gogoproto.nullable) = false,
    (gogoproto.jsontag) = "resolve_tx_hash,omitempty"
  ];

  // 原始提案的 outcome：0=YES，1=NO
  share.schema.PredictionOutcome proposed_outcome = 17
      [(gogoproto.jsontag) = "proposed_outcome"];
}

// 预测市场全局配置
message GetPredictionConfigRequest {}

// 预测市场全局配置
message GetPredictionConfigResponse {
  // 创建预测事件所需的保证金
  string create_market_bond_amount = 1 [
    (gogoproto.customtype) = "github.com/exc-works/decimal.Decimal",
    (gogoproto.nullable) = false,
    (gogoproto.jsontag) = "create_market_bond_amount"
  ];
  // 发起结果提案所需的保证金
  string proposal_bond_amount = 2 [
    (gogoproto.customtype) = "github.com/exc-works/decimal.Decimal",
    (gogoproto.nullable) = false,
    (gogoproto.jsontag) = "proposal_bond_amount"
  ];
  // 发起争议所需的保证金
  string dispute_bond_amount = 3 [
    (gogoproto.customtype) = "github.com/exc-works/decimal.Decimal",
    (gogoproto.nullable) = false,
    (gogoproto.jsontag) = "dispute_bond_amount"
  ];
  // 争议窗口时长，毫秒
  int64 dispute_duration = 4 [(gogoproto.jsontag) = "dispute_duration"];
  // 事件截止时间相对当前的最小时长，毫秒
  int64 min_event_expire_duration = 5
      [(gogoproto.jsontag) = "min_event_expire_duration"];
  // 事件截止时间相对当前的最大时长，毫秒
  int64 max_event_expire_duration = 6
      [(gogoproto.jsontag) = "max_event_expire_duration"];
  // 每轮撮合处理的对手方订单数量上限；0 表示不限制
  uint32 max_number_of_order_each_match = 7
      [(gogoproto.jsontag) = "max_number_of_order_each_match"];
  // 单账户每个市场的活跃挂单数量上限；0 表示不限制
  uint32 max_orders_per_account = 8
      [(gogoproto.jsontag) = "max_orders_per_account"];
  // 手续费计算所用的指数
  uint32 fee_exponent = 9 [(gogoproto.jsontag) = "fee_exponent"];
  // 原始提案的 outcome：0=YES，1=NO
  share.schema.PredictionOutcome proposed_outcome = 10
      [(gogoproto.jsontag) = "proposedOutcome"];
}
