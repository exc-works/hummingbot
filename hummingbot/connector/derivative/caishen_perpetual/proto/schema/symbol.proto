// UpdateSpotSymbolMessage updates mutable fields of a spot symbol.
message UpdateSpotSymbolMessage {
  // Base token id.
  // Must be different from quote_token.
  uint32 base_token = 1;
  // Quote token id.
  // Must be different from base_token.
  uint32 quote_token = 2;

  // Symbol open time in Unix milliseconds.
  // Can be updated before open or after close (not while symbol is open).
  optional int64 open_time = 3;
  // Symbol close time in Unix milliseconds.
  // If set and non-zero, must be later than the effective open_time.
  optional int64 close_time = 4;
  // New tick size.
  // Must be > 0, must keep power-of-ten step semantics, and cannot be larger
  // than current tick_size (only equal or finer).
  optional string tick_size = 5 [(schema.decimal) = true];
  // New per-match max-order cap. 0 means no limit.
  optional uint32 max_number_of_order_each_match = 8;
  // New per-account max-open-order cap. 0 means no limit.
  optional uint32 max_number_of_order_each_account = 9;
  // New limit-order price-band ratio. Must be in (0, 1).
  optional string price_limit_bound = 10 [(schema.decimal) = true];
  // New minimum notional in quote asset. Must be >= 0.
  optional string min_notional = 11 [(schema.decimal) = true];
  // New maximum notional in quote asset.
  // Must be >= 0, and if > 0 must be >= effective min_notional.
  optional string max_notional = 12 [(schema.decimal) = true];
  // New conditional-order price-band ratio.
  // Must be in (0, 1), and must be >= effective price_limit_bound.
  optional string conditional_price_limit_bound = 13 [(schema.decimal) = true];
}

// SpotBatchDelistSymbolMessage performs spot delist work in bounded batches.
message SpotBatchDelistSymbolMessage {
  // Base token id.
  uint32 base_token = 1;
  // Quote token id.
  uint32 quote_token = 2;
  // Max number of orders processed in this batch step. Must be > 0.
  uint32 batch_size = 3;
}

// BatchDelistSymbolMessage performs perp delist work in bounded batches.
message BatchDelistSymbolMessage {
  // Base token id.
  uint32 base_token = 1;
  // Quote token id.
  uint32 quote_token = 2;
  // Settlement price used for delist position closing.
  // Must be >= 0.
  // "0" is only allowed when no positions remain.
  // Example: "2500".
  string settlement_price = 3 [(schema.decimal) = true];
  // Max number of orders/positions processed in this batch step. Must be > 0.
  uint32 batch_size = 4;
}
