syntax = "proto3";
package share.schema;

option go_package = "github.com/exc-works/caishen/share/schema";

import "schema/extensions.proto";

message RangeMessage {
  string lower = 1 [(schema.decimal) = true];
  string upper = 2 [(schema.decimal) = true];
}

message RiskLimitMessage {
  RangeMessage range = 1;
  string mmr = 2 [(schema.decimal) = true];
  uint32 max_leverage = 3;
}

message RegisterRiskLimitsMessage {
  uint32 id = 1;
  repeated RiskLimitMessage risk_limits = 2;
}

message RegisterSymbolMessage {
  uint32 base_token = 1;
  uint32 quote_token = 2;
  int64 open_time = 3;
  int64 close_time = 4;
  string tick_size = 5 [(schema.decimal) = true];
  string lot_size = 6 [(schema.decimal) = true];
  string min_size = 7 [(schema.decimal) = true];
  uint32 max_number_of_order_each_match = 8;
  uint32 max_number_of_order_each_account = 9;
  uint32 funding_interval_hours = 10;
  string funding_rate_bound = 11 [(schema.decimal) = true];
  string price_limit_bound = 12
      [(schema.decimal) = true];  // 限价单价格限制比例
  uint32 default_leverage = 13;
  uint32 risk_limits_id = 14;
}
