syntax = "proto3";

package share.schema;

option go_package = "github.com/exc-works/caishen/share/schema";

import "schema/base.proto";
import "schema/extensions.proto";
import "schema/order.proto";
import "schema/prediction.proto";
import "schema/symbol.proto";
import "schema/fee_tier.proto";
import "schema/error.proto";
import "schema/tx.proto";
import "schema/chain.proto";
import "schema/subaccount.proto";
import "schema/strategy.proto";
import "schema/vault.proto";
import "google/protobuf/timestamp.proto";

// Reason for a forced vault withdrawal.
enum VaultForcedWithdrawReason {
  // Not forced.
  VAULT_FORCED_WITHDRAW_REASON_NONE = 0;
  // Forced because the vault is closing.
  VAULT_FORCED_WITHDRAW_REASON_CLOSE = 1;
  // Forced because vault maintenance is settling depositor shares.
  VAULT_FORCED_WITHDRAW_REASON_MAINTENANCE = 2;
}

// Aggregates all state changes emitted while processing a single transaction.
message ChangesCollector {
  // Block time of the command that produced this collector entry.
  google.protobuf.Timestamp time = 1;
  // Block number of the command that produced this collector entry.
  uint64 number = 2;
  // Transaction hash (32-byte) for the processed command.
  bytes tx_hash = 3 [(schema.hash) = true];
  // Primary target account address (20-byte) of the command.
  bytes target_address = 4 [(schema.address) = true];
  reserved 5 to 7;

  // Asset change.
  AssetChange asset_change = 8;
  reserved 9;
  // Funding change.
  FundingChange funding_change = 10;
  // Metadata change.
  MetadataChange metadata_change = 11;
  // Order change.
  OrderChange order_change = 12;
  // Position change.
  PositionChange position_change = 13;
  // Price change.
  PriceChange price_change = 14;
  // Block change.
  BlockChange block_change = 15;
  // Vault change.
  VaultChange vault_change = 16;
}

// Block-level change list.
message BlockChange {
  // Ordered list of change entries.
  repeated BlockChangeEntry changes = 1;
}

// One block-level change entry.
message BlockChangeEntry {
  // BlockStarted payload.
  message BlockStarted {
    // Block number.
    uint64 number = 1;
    // Unix time in milliseconds unless otherwise specified.
    int64 time = 2;
  }
  // BlockEnded payload.
  message BlockEnded {
    // Block number.
    uint64 number = 1;
    // Block hash bytes (32-byte).
    bytes hash = 2 [(schema.hash) = true];
    // The number of transactions included in the block.
    uint32 tx_count = 3;
  }
  // TxProcessed payload.
  message TxProcessed {
    // Action type processed in this transaction.
    TxActionType action = 1;
    // Error payload for failed processing, if any.
    Error error = 2;
  }

  // Union of concrete change variants.
  oneof change {
    // Oneof variant for change: block started.
    BlockStarted block_started = 1;
    // Oneof variant for change: block ended.
    BlockEnded block_ended = 2;
    // Oneof variant for change: tx processed.
    TxProcessed tx_processed = 3;
  }
}

// Asset balance and frozen-balance change list.
message AssetChange {
  // Ordered list of change entries.
  repeated AssetChangeEntry changes = 1;
}

// One asset change entry for one account/token view.
message AssetChangeEntry {
  // Reason why frozen funds/size are released from an order.
  enum OrderReleaseReason {
    // Default zero value.
    REASON_UNSPECIFIED = 0;
    // Released because the order was cancelled.
    CANCELLED = 1;
    // Released because the order expired by matching rules/time-in-force.
    EXPIRED = 2;
    // Released because the order expired due to self-trade prevention (STP).
    STP_EXPIRED = 3;
  }
  // Reason category of prediction-market bond freeze/release/slash.
  enum PredictionBondReason {
    // Default zero value.
    PREDICTION_BOND_REASON_UNSPECIFIED = 0;
    // Bond used when creating a prediction event/market.
    CREATE_EVENT = 1;
    // Bond used for proposing an outcome.
    PROPOSAL = 2;
    // Bond used for disputing a proposed outcome.
    DISPUTE = 3;
  }
  // Union of concrete change variants.
  oneof change {
    // Oneof variant for change: deposited.
    Deposited deposited = 1;
    // Oneof variant for change: withdrew.
    Withdrew withdrew = 2;
    // Oneof variant for change: position funding settled.
    PositionFundingSettled position_funding_settled = 3;
    // Oneof variant for change: order placed.
    OrderPlaced order_placed = 5;
    // Oneof variant for change: position increased.
    PositionIncreased position_increased = 7;
    // Oneof variant for change: position decreased.
    PositionDecreased position_decreased = 8;
    // Oneof variant for change: insurance fund pnl loss covered.
    InsuranceFundPnLLossCovered insurance_fund_pnl_loss_covered = 9;
    // Oneof variant for change: position margin increased.
    PositionMarginIncreased position_margin_increased = 10;
    // Oneof variant for change: position margin decreased.
    PositionMarginDecreased position_margin_decreased = 11;
    // Oneof variant for change: transfer in.
    TransferIn transfer_in = 12;
    // Oneof variant for change: transfer out.
    TransferOut transfer_out = 13;
    // Oneof variant for change: withdrew confirmed.
    WithdrewConfirmed withdrew_confirmed = 14;
    // Oneof variant for change: withdrew rejected.
    WithdrewRejected withdrew_rejected = 15;
    // Oneof variant for change: order frozen released.
    OrderFrozenReleased order_frozen_released = 16;
    // Oneof variant for change: position leverage changed.
    PositionLeverageChanged position_leverage_changed = 17;
    // Oneof variant for change: account bankruptcy loss covered.
    AccountBankruptcyLossCovered account_bankruptcy_loss_covered = 18;
    InsuranceFundBankruptcyLossCovered insurance_fund_bankruptcy_loss_covered =
        19;
    // Oneof variant for change: risk account margin transferred.
    RiskAccountMarginTransferred risk_account_margin_transferred = 20;
    // Oneof variant for change: order amended.
    OrderAmended order_amended = 21;
    // Oneof variant for change: risk account covered.
    RiskAccountCovered risk_account_covered = 22;
    // Oneof variant for change: insurance fund covered.
    InsuranceFundCovered insurance_fund_covered = 23;
    // Oneof variant for change: vault creation fee paid.
    VaultCreationFeePaid vault_creation_fee_paid = 24;
    // Oneof variant for change: vault deposited.
    VaultDeposited vault_deposited = 25;
    VaultDepositorDeposited vault_depositor_deposited = 26;
    // Oneof variant for change: vault withdrew.
    VaultWithdrew vault_withdrew = 27;
    VaultDepositorWithdrew vault_depositor_withdrew = 28;
    // Oneof variant for change: vault leader fee paid.
    VaultLeaderFeePaid vault_leader_fee_paid = 29;
    VaultLeaderFeeReceived vault_leader_fee_received = 30;
    VaultCloseDustTransferred dust_transferred = 31;
    // reserved 32 to 36;
    SpotOrderPlaced spot_order_placed = 37;
    // Oneof variant for change: spot order amended.
    SpotOrderAmended spot_order_amended = 38;
    // Oneof variant for change: spot order frozen released.
    SpotOrderFrozenReleased spot_order_frozen_released = 39;
    // Oneof variant for change: spot order executed.
    SpotOrderExecuted spot_order_executed = 40;
    // Oneof variant for change: transfer account in.
    TransferAccountIn transfer_account_in = 41;
    // Oneof variant for change: transfer account out.
    TransferAccountOut transfer_account_out = 42;
    // Oneof variant for change: prediction market bond frozen.
    PredictionMarketBondFrozen prediction_market_bond_frozen = 43;
    // Oneof variant for change: prediction split.
    PredictionSplit prediction_split = 44;
    // Oneof variant for change: prediction merge.
    PredictionMerge prediction_merge = 45;
    // Oneof variant for change: prediction order placed.
    PredictionOrderPlaced prediction_order_placed = 46;
    // Oneof variant for change: prediction order frozen released.
    PredictionOrderFrozenReleased prediction_order_frozen_released = 47;
    // Oneof variant for change: prediction order executed.
    PredictionOrderExecuted prediction_order_executed = 48;
    // Oneof variant for change: prediction market bond released.
    PredictionMarketBondReleased prediction_market_bond_released = 49;
    // Oneof variant for change: prediction market bond slashed.
    PredictionMarketBondSlashed prediction_market_bond_slashed = 50;
    // Oneof variant for change: prediction market bond distributed.
    PredictionMarketBondDistributed prediction_market_bond_distributed = 51;
    // Oneof variant for change: prediction outcome settled.
    PredictionOutcomeSettled prediction_outcome_settled = 52;
  }

  // PredictionMarketBondFrozen payload.
  message PredictionMarketBondFrozen {
    // Prediction event id.
    uint64 event_id = 1;
    // Account address (20-byte EVM address).
    bytes account = 2 [(schema.address) = true];
    // Token id.
    uint32 token_id = 3;
    // Bond amount frozen by this action. Always positive.
    string amount = 4 [(schema.decimal) = true];
    // Wallet after this change (decimal string).
    string wallet_after = 5 [(schema.decimal) = true];
    // Order frozen after this change (decimal string).
    string order_frozen_after = 6 [(schema.decimal) = true];
    // Master account address (20-byte) if this account is a subaccount; omitted
    // otherwise.
    optional bytes master_account = 7 [(schema.address) = true];
    // Reason string or enum for this event.
    PredictionBondReason reason = 8;
  }

  // PredictionMarketBondReleased payload.
  message PredictionMarketBondReleased {
    // Prediction event id.
    uint64 event_id = 1;
    // Account address (20-byte EVM address).
    bytes account = 2 [(schema.address) = true];
    // Token id.
    uint32 token_id = 3;
    // Bond amount released by this action. Always positive.
    string amount = 4 [(schema.decimal) = true];
    // Wallet after this change (decimal string).
    string wallet_after = 5 [(schema.decimal) = true];
    // Order frozen after this change (decimal string).
    string order_frozen_after = 6 [(schema.decimal) = true];
    // Master account address (20-byte) if this account is a subaccount; omitted
    // otherwise.
    optional bytes master_account = 7 [(schema.address) = true];
    // Reason string or enum for this event.
    PredictionBondReason reason = 8;
  }

  // PredictionMarketBondSlashed payload.
  message PredictionMarketBondSlashed {
    // Prediction event id.
    uint64 event_id = 1;
    // Account address (20-byte EVM address).
    bytes account = 2 [(schema.address) = true];
    // Token id.
    uint32 token_id = 3;
    // Bond amount slashed by this action. Always positive.
    string amount = 4 [(schema.decimal) = true];
    // Wallet after this change (decimal string).
    string wallet_after = 5 [(schema.decimal) = true];
    // Order frozen after this change (decimal string).
    string order_frozen_after = 6 [(schema.decimal) = true];
    // Master account address (20-byte) if this account is a subaccount; omitted
    // otherwise.
    optional bytes master_account = 7 [(schema.address) = true];
    // Reason string or enum for this event.
    PredictionBondReason reason = 8;
    // YES token id.
    uint32 yes_token_id = 9;
    // NO token id.
    uint32 no_token_id = 10;
  }

  // PredictionMarketBondDistributed payload.
  message PredictionMarketBondDistributed {
    // Prediction event id.
    uint64 event_id = 1;
    // Account address (20-byte EVM address).
    bytes account = 2 [(schema.address) = true];
    // Token id.
    uint32 token_id = 3;
    // Bond amount distributed by this action. Always positive.
    string amount = 4 [(schema.decimal) = true];
    // Wallet after this change (decimal string).
    string wallet_after = 5 [(schema.decimal) = true];
    // Master account address (20-byte) if this account is a subaccount; omitted
    // otherwise.
    optional bytes master_account = 6 [(schema.address) = true];
    // YES token id.
    uint32 yes_token_id = 7;
    // NO token id.
    uint32 no_token_id = 8;
  }

  // PredictionSplit payload.
  message PredictionSplit {
    // Account address (20-byte EVM address).
    bytes account = 1 [(schema.address) = true];
    // YES token id.
    uint32 yes_token_id = 2;
    // NO token id.
    uint32 no_token_id = 3;
    // Quote token id.
    uint32 quote_token_id = 4;
    // Split size. Always positive; YES and NO positions increase by this
    // amount.
    string size = 5 [(schema.decimal) = true];
    // Quote wallet after this change (decimal string).
    string quote_wallet_after = 6 [(schema.decimal) = true];
    // Yes entry price after this change (decimal string).
    string yes_entry_price_after = 7 [(schema.decimal) = true];
    // Yes size after this change (decimal string).
    string yes_size_after = 8 [(schema.decimal) = true];
    // Master account address (20-byte) if this account is a subaccount; omitted
    // otherwise.
    optional bytes master_account = 9 [(schema.address) = true];
    // Prediction event id.
    uint64 event_id = 10;
    // No entry price after this change (decimal string).
    string no_entry_price_after = 11 [(schema.decimal) = true];
    // No size after this change (decimal string).
    string no_size_after = 12 [(schema.decimal) = true];
    // YES position id.
    uint64 yes_position_id = 13;
    // NO position id.
    uint64 no_position_id = 14;
  }

  // PredictionMerge payload.
  message PredictionMerge {
    // Account address (20-byte EVM address).
    bytes account = 1 [(schema.address) = true];
    // YES token id.
    uint32 yes_token_id = 2;
    // NO token id.
    uint32 no_token_id = 3;
    // Quote token id.
    uint32 quote_token_id = 4;
    // Merge size in event sign convention. Always negative; YES and NO
    // positions decrease by abs(size).
    string size = 5 [(schema.decimal) = true];
    // Quote wallet after this change (decimal string).
    string quote_wallet_after = 6 [(schema.decimal) = true];
    // Yes size after this change (decimal string).
    string yes_size_after = 7 [(schema.decimal) = true];
    // Master account address (20-byte) if this account is a subaccount; omitted
    // otherwise.
    optional bytes master_account = 8 [(schema.address) = true];
    // Prediction event id.
    uint64 event_id = 9;
    // Yes realized pnl as decimal string.
    string yes_realized_pnl = 10 [(schema.decimal) = true];
    // Yes realized pnl after this change (decimal string).
    string yes_realized_pnl_after = 11 [(schema.decimal) = true];
    // No size after this change (decimal string).
    string no_size_after = 12 [(schema.decimal) = true];
    // No realized pnl as decimal string.
    string no_realized_pnl = 13 [(schema.decimal) = true];
    // No realized pnl after this change (decimal string).
    string no_realized_pnl_after = 14 [(schema.decimal) = true];
    // YES position id.
    uint64 yes_position_id = 15;
    // NO position id.
    uint64 no_position_id = 16;
  }

  // PredictionOutcomeSettled payload.
  message PredictionOutcomeSettled {
    // Prediction event id.
    uint64 event_id = 1;
    // Account address (20-byte EVM address).
    bytes account = 2 [(schema.address) = true];
    // YES token id.
    uint32 yes_token_id = 3;
    // NO token id.
    uint32 no_token_id = 4;
    // Quote token id.
    uint32 quote_token_id = 5;
    // Prediction outcome value.
    PredictionOutcome outcome = 6;
    // Settled position size. Always positive.
    string size = 7 [(schema.decimal) = true];
    // Quote received in settlement. Winners > 0, losers = 0.
    string quote_amount = 8 [(schema.decimal) = true];
    // Quote wallet after this change (decimal string).
    string quote_wallet_after = 9 [(schema.decimal) = true];
    // Realized pnl as decimal string.
    string realized_pnl = 10 [(schema.decimal) = true];
    // Realized pnl after this change (decimal string).
    string realized_pnl_after = 11 [(schema.decimal) = true];
    // Master account address (20-byte) if this account is a subaccount; omitted
    // otherwise.
    optional bytes master_account = 12 [(schema.address) = true];
    // Position id.
    uint64 position_id = 13;
  }

  // Deposited payload.
  message Deposited {
    // Account address (20-byte EVM address).
    bytes account = 1 [(schema.address) = true];
    // Token id.
    uint32 token_id = 2;
    // Wallet delta from deposit. Always positive.
    string wallet_delta = 3 [(schema.decimal) = true];
    // Wallet as decimal string.
    string wallet = 4 [(schema.decimal) = true];
    // Chain id.
    uint64 chain_id = 5;
    // Deposit transaction hash bytes.
    bytes deposit_hash = 6;
    // Idempotency key bytes for deduplicating deposit requests.
    bytes idempotency_key = 7;
    // Master account address (20-byte) if this account is a subaccount; omitted
    // otherwise.
    optional bytes master_account = 8 [(schema.address) = true];
    // Trading domain where this change applies.
    TradingDomain trading_domain = 9;
    // Entry price after this change (decimal string).
    optional string entry_price_after = 10 [(schema.decimal) = true];
    // USD price snapshot used for valuation (decimal string).
    optional string usd_price = 11 [(schema.decimal) = true];
  }

  // Withdrew payload.
  message Withdrew {
    // Account address (20-byte EVM address).
    bytes account = 1 [(schema.address) = true];
    // Token id.
    uint32 token_id = 2;
    // Wallet delta for withdrawal request. Always negative (debited at request
    // time). Example: withdraw 10 => "-10".
    string wallet_delta = 3 [(schema.decimal) = true];
    // Wallet after this change (decimal string).
    string wallet_after = 4 [(schema.decimal) = true];
    // Pending withdraw request id.
    uint64 pending_id = 5;
    // Configured withdrawal fee (non-negative decimal). Example: fee 1 => "1".
    string withdraw_fee = 6 [(schema.decimal) = true];
    // Master account address (20-byte) if this account is a subaccount; omitted
    // otherwise.
    optional bytes master_account = 7 [(schema.address) = true];
    // Chain id.
    uint64 chain_id = 8;
    // Receiver bytes (chain-specific address format).
    bytes receiver = 9;
    // Trading domain where this change applies.
    TradingDomain trading_domain = 10;
  }

  // WithdrewConfirmed payload.
  message WithdrewConfirmed {
    // Pending withdraw request id.
    uint64 pending_id = 1;
    // Account address (20-byte EVM address).
    bytes account = 2 [(schema.address) = true];
    // Token id.
    uint32 token_id = 3;
    // Confirmed withdrawal amount in event sign convention. Always negative.
    string amount = 4 [(schema.decimal) = true];
    // On-chain withdrawal transaction hash bytes (32-byte).
    bytes hash = 5 [(schema.hash) = true];
    // Master account address (20-byte) if this account is a subaccount; omitted
    // otherwise.
    optional bytes master_account = 6 [(schema.address) = true];
    // Wallet after this change (decimal string).
    string wallet_after = 7 [(schema.decimal) = true];
    // Trading domain where this change applies.
    TradingDomain trading_domain = 8;
    // Realized pnl delta. Positive = profit, negative = loss.
    optional string realized_pnl = 9 [(schema.decimal) = true];
    // Cumulative realized pnl after this change.
    optional string realized_pnl_after = 10 [(schema.decimal) = true];
    // Usd price as decimal string.
    optional string usd_price = 11 [(schema.decimal) = true];
  }

  // WithdrewRejected payload.
  message WithdrewRejected {
    // Pending withdraw request id.
    uint64 pending_id = 1;
    // Account address (20-byte EVM address).
    bytes account = 2 [(schema.address) = true];
    // Token id.
    uint32 token_id = 3;
    // Returned amount on rejection. Always positive.
    string amount = 4 [(schema.decimal) = true];
    // Wallet after this change (decimal string).
    string wallet_after = 5 [(schema.decimal) = true];
    // Reason string or enum for this event.
    string reason = 6;
    // Master account address (20-byte) if this account is a subaccount; omitted
    // otherwise.
    optional bytes master_account = 7 [(schema.address) = true];
    // Trading domain where this change applies.
    TradingDomain trading_domain = 8;
  }

  // TransferOut payload.
  message TransferOut {
    // Account address (20-byte EVM address).
    bytes account = 1 [(schema.address) = true];
    // Dst account address (20-byte EVM address).
    bytes dst_account = 2 [(schema.address) = true];
    // Token id.
    uint32 token_id = 3;
    // Transferred-out amount in event sign convention. Always negative.
    string amount = 4 [(schema.decimal) = true];
    // Wallet as decimal string.
    string wallet = 5 [(schema.decimal) = true];
    // Master account address (20-byte) if this account is a subaccount; omitted
    // otherwise.
    optional bytes master_account = 6 [(schema.address) = true];
    // Trading domain where this change applies.
    TradingDomain trading_domain = 7;
    // Realized pnl delta. Positive = profit, negative = loss.
    optional string realized_pnl = 8 [(schema.decimal) = true];
    // Cumulative realized pnl after this change.
    optional string realized_pnl_after = 9 [(schema.decimal) = true];
  }

  // TransferIn payload.
  message TransferIn {
    // Account address (20-byte EVM address).
    bytes account = 1 [(schema.address) = true];
    // Src account address (20-byte EVM address).
    bytes src_account = 2 [(schema.address) = true];
    // Token id.
    uint32 token_id = 3;
    // Transferred-in amount in event sign convention. Always positive.
    string amount = 4 [(schema.decimal) = true];
    // Wallet as decimal string.
    string wallet = 5 [(schema.decimal) = true];
    // Master account address (20-byte) if this account is a subaccount; omitted
    // otherwise.
    optional bytes master_account = 6 [(schema.address) = true];
    // Trading domain where this change applies.
    TradingDomain trading_domain = 7;
    // Entry price after this change (decimal string).
    optional string entry_price_after = 8 [(schema.decimal) = true];
  }

  // TransferAccountOut payload.
  message TransferAccountOut {
    // Account address (20-byte EVM address).
    bytes account = 1 [(schema.address) = true];
    // Token id.
    uint32 token_id = 2;
    // Cross-domain transfer-out amount in event sign convention. Always
    // negative.
    string amount = 3 [(schema.decimal) = true];
    // Wallet as decimal string.
    string wallet = 4 [(schema.decimal) = true];
    // Master account address (20-byte) if this account is a subaccount; omitted
    // otherwise.
    optional bytes master_account = 5 [(schema.address) = true];
    // Source trading domain.
    TradingDomain from_domain = 6;
    // Destination trading domain.
    TradingDomain to_domain = 7;
  }

  // TransferAccountIn payload.
  message TransferAccountIn {
    // Account address (20-byte EVM address).
    bytes account = 1 [(schema.address) = true];
    // Token id.
    uint32 token_id = 2;
    // Cross-domain transfer-in amount in event sign convention. Always
    // positive.
    string amount = 3 [(schema.decimal) = true];
    // Wallet as decimal string.
    string wallet = 4 [(schema.decimal) = true];
    // Master account address (20-byte) if this account is a subaccount; omitted
    // otherwise.
    optional bytes master_account = 5 [(schema.address) = true];
    // Source trading domain.
    TradingDomain from_domain = 6;
    // Destination trading domain.
    TradingDomain to_domain = 7;
  }

  // PositionFundingSettled payload.
  message PositionFundingSettled {
    // Position id.
    uint64 id = 1;
    // Account address (20-byte EVM address).
    bytes account = 2 [(schema.address) = true];
    // Base token id.
    uint32 base_token = 3;
    // Quote token id.
    uint32 quote_token = 4;
    // Position mode.
    PositionMode mode = 5;
    // Position/order side.
    PositionSide side = 6;
    // Funding fee delta for this account. Positive = received, negative = paid.
    string amount = 7 [(schema.decimal) = true];
    // Wallet as decimal string.
    string wallet = 8 [(schema.decimal) = true];
    // Isolated position frozen as decimal string.
    string isolated_position_frozen = 9 [(schema.decimal) = true];
    // Master account address (20-byte) if this account is a subaccount; omitted
    // otherwise.
    optional bytes master_account = 10 [(schema.address) = true];
  }

  // OrderPlaced payload.
  message OrderPlaced {
    // Order id.
    uint64 id = 1;
    // Base token id.
    uint32 base_token = 2;
    // Quote token id.
    uint32 quote_token = 3;
    // Position mode.
    PositionMode mode = 4;
    // Position/order side.
    PositionSide side = 5;
    // Frozen margin increase for order placement. Always positive.
    string amount = 6 [(schema.decimal) = true];
    // Cross order frozen as decimal string.
    optional string cross_order_frozen = 7 [(schema.decimal) = true];
    // Isolated order frozen as decimal string.
    optional string isolated_order_frozen = 8 [(schema.decimal) = true];
    // Account address (20-byte EVM address).
    bytes account = 9 [(schema.address) = true];
    // Master account address (20-byte) if this account is a subaccount; omitted
    // otherwise.
    optional bytes master_account = 10 [(schema.address) = true];
  }

  // PositionIncreased payload.
  message PositionIncreased {
    // Position id.
    uint64 id = 1;
    // Account address (20-byte EVM address).
    bytes account = 2 [(schema.address) = true];
    // Base token id.
    uint32 base_token = 3;
    // Quote token id.
    uint32 quote_token = 4;
    // Position mode.
    PositionMode mode = 5;
    // Position/order side.
    PositionSide side = 6;
    // Fee delta. Positive = rebate/credit, negative = fee paid.
    string fee = 7 [(schema.decimal) = true];
    // Isolated position frozen as decimal string.
    optional string isolated_position_frozen = 8 [(schema.decimal) = true];
    // Isolated order frozen as decimal string.
    optional string isolated_order_frozen = 9 [(schema.decimal) = true];
    // Cross order frozen as decimal string.
    optional string cross_order_frozen = 10 [(schema.decimal) = true];
    // Wallet as decimal string.
    string wallet = 11 [(schema.decimal) = true];
    // Master account address (20-byte) if this account is a subaccount; omitted
