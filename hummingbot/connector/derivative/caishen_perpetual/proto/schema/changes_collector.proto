  // Trigger order type.
  OrderType trigger_order_type = 3;
  // Price as decimal string.
  string price = 4 [(schema.decimal) = true];
}

// Resolved trailing-order parameters snapshot stored in change events.
message TrailingParams {
  // Trigger direction.
  TriggerDirection trigger_direction = 1;
  // Activation price as decimal string.
  string activation_price = 2 [(schema.decimal) = true];
  // Trailing base price as decimal string.
  string trailing_base_price = 3 [(schema.decimal) = true];
  // Trailing delta type.
  TrailingDeltaType trailing_delta_type = 4;
  // Trailing delta as decimal string.
  // DISTANCE: absolute quote-price offset.
  // PERCENTAGE: ratio (for example, "0.01" means 1%).
  string trailing_delta = 5 [(schema.decimal) = true];
  // Resolved trigger price produced after trailing activation.
  string trigger_price = 6 [(schema.decimal) = true];
  // Trigger order type.
  OrderType trigger_order_type = 7;
}

// Funding-rate and funding-settlement change list.
message FundingChange {
  // Ordered list of change entries.
  repeated FundingRateChangeEntry changes = 1;
}

// Funding-rate update and optional settlement snapshot.
message FundingRateChangeEntry {
  // Base token id.
  uint32 base_token = 1;
  // Quote token id.
  uint32 quote_token = 2;
  // Funding rate as decimal string.
  string funding_rate = 3 [(schema.decimal) = true];
  // Update time (UTC).
  google.protobuf.Timestamp update_time = 4;
  // Funding interval in hours.
  uint32 interval_hours = 5;
  // Funding rate bound as decimal string.
  string funding_rate_bound = 6 [(schema.decimal) = true];

  // Whether settled.
  bool settled = 7;
  // Growth delta as decimal string.
  optional string growth_delta = 8 [(schema.decimal) = true];
  // Long growth after this change (decimal string).
  optional string long_growth_after = 9 [(schema.decimal) = true];
  // Short growth after this change (decimal string).
  optional string short_growth_after = 10 [(schema.decimal) = true];
}

// Index/mark price change list.
message PriceChange {
  // Ordered list of change entries.
  repeated PriceChangeEntry changes = 1;
}

// One index/mark price update.
message PriceChangeEntry {
  // Base token id.
  uint32 base_token = 1;
  // Quote token id.
  uint32 quote_token = 2;
  // Index price as decimal string.
  string index_price = 3 [(schema.decimal) = true];
  // Mark price as decimal string.
  string mark_price = 4 [(schema.decimal) = true];
  // Update time (UTC).
  google.protobuf.Timestamp update_time = 5;
}

// Metadata mutation change list (symbols, chains, fee tiers, etc.).
message MetadataChange {
  // Ordered list of change entries.
  repeated MetadataChangeEntry changes = 1;
}

// One metadata mutation entry.
message MetadataChangeEntry {
  // ChainEnabled payload.
  message ChainEnabled {
    // Chain id.
    uint64 chain_id = 1;
    // Chain name.
    string chain_name = 2;
  }
  // ChainDisabled payload.
  message ChainDisabled {
    // Chain id.
    uint64 chain_id = 1;
  }
  // TokenMetadataChanged payload.
  message TokenMetadataChanged {
    // Entity identifier.
    uint32 id = 1;
    // Name.
    string name = 2;
    // Symbol.
    string symbol = 3;
    // Decimals.
    uint32 decimals = 4;
    // Reference price as decimal string.
    string reference_price = 5 [(schema.decimal) = true];
  }
  // RiskLimitsRegistered payload.
  message RiskLimitsRegistered {
    // Entity identifier.
    uint32 id = 1;
    // List of risk limits.
    repeated RiskLimitMessage risk_limits = 2;
  }
  // SymbolMetadataChanged payload.
  message SymbolMetadataChanged {
    // Base token id.
    uint32 base_token = 1;
    // Quote token id.
    uint32 quote_token = 2;
    // Symbol open time in Unix milliseconds.
    int64 open_time = 3;
    // Symbol close time in Unix milliseconds.
    int64 close_time = 4;
    // Tick size as decimal string.
    string tick_size = 5 [(schema.decimal) = true];
    // Lot size as decimal string.
    string lot_size = 6 [(schema.decimal) = true];
    // Min size limit (decimal string).
    string min_size = 7 [(schema.decimal) = true];
    // Max number of order each match.
    uint32 max_number_of_order_each_match = 8;
    // Max number of order each account.
    uint32 max_number_of_order_each_account = 9;
    // Funding interval hours.
    uint32 funding_interval_hours = 10;
    // Funding rate bound as decimal string.
    string funding_rate_bound = 11 [(schema.decimal) = true];
    // Price-limit ratio for limit orders (decimal, e.g. "0.1" for 10%).
    string price_limit_bound = 12 [(schema.decimal) = true];
    // Default leverage.
    uint32 default_leverage = 13;
    // Risk limits id.
    uint32 risk_limits_id = 14;
    // Status enum/int value after change.
    SymbolStatus status = 15;
    // Min notional limit (decimal string).
    string min_notional = 16 [(schema.decimal) = true];
    // Max notional limit (decimal string).
    string max_notional = 17 [(schema.decimal) = true];
    // Conditional price limit bound as decimal string.
    string conditional_price_limit_bound = 18 [(schema.decimal) = true];
  }
  // FeeTierChanged payload.
  message FeeTierChanged {
    // Trading domain where this change applies.
    TradingDomain trading_domain = 1;
    // List of fee tiers.
    repeated FeeTierMessage fee_tiers = 2;
  }
  // AgentApproved payload.
  message AgentApproved {
    // Account address (20-byte EVM address).
    bytes account = 1 [(schema.address) = true];
    // Agent address (20-byte EVM address).
    bytes agent = 2 [(schema.address) = true];
    // Name.
    string name = 3;
    // Expiration timestamp (UTC).
    google.protobuf.Timestamp expired_time = 4;
  }
  // AgentRevoked payload.
  message AgentRevoked {
    // Account address (20-byte EVM address).
    bytes account = 1 [(schema.address) = true];
    // Name.
    string name = 2;
  }
  // AgentExpired payload.
  message AgentExpired {
    // Account address (20-byte EVM address).
    bytes account = 1 [(schema.address) = true];
    // Names affected by this change.
    repeated string names = 2;
  }
  // AccountFeeTierChanged payload.
  message AccountFeeTierChanged {
    // Account address (20-byte EVM address).
    bytes account = 1 [(schema.address) = true];
    // Tier.
    uint32 tier = 2;
  }
  // MultisigConverted payload.
  message MultisigConverted {
    // Account address (20-byte EVM address).
    bytes account = 1 [(schema.address) = true];
    // List of signers.
    repeated bytes signers = 2;
    // Threshold.
    uint32 threshold = 3;
  }
  // MultisigConfigUpdated payload.
  message MultisigConfigUpdated {
    // Account address (20-byte EVM address).
    bytes account = 1 [(schema.address) = true];
    // List of signers.
    repeated bytes signers = 2;
    // Threshold.
    uint32 threshold = 3;
  }
  // MultisigDisabled payload.
  message MultisigDisabled {
    // Account address (20-byte EVM address).
    bytes account = 1 [(schema.address) = true];
  }
  // SubaccountCreated payload.
  message SubaccountCreated {
    // Master account address (20-byte EVM address).
    bytes master_account = 1 [(schema.address) = true];
    // Subaccount address (20-byte EVM address).
    bytes subaccount = 2 [(schema.address) = true];
    // Index.
    uint32 index = 3;
    // Name.
    string name = 4;
    // Requested subaccount category. Currently CREATE_SUBACCOUNT accepts
    // USER_CREATED only.
    SubaccountType type = 5;
  }
  // DepositWithdrawConfigUpdated payload.
  message DepositWithdrawConfigUpdated {
    // Token id.
    uint32 token_id = 1;
    // Chain id.
    uint64 chain_id = 2;
    // Contract address bytes for deposit/withdraw config.
    bytes contract = 3;
    // Min deposit limit (decimal string).
    string min_deposit = 4 [(schema.decimal) = true];
    // Block confirmations.
    uint32 block_confirmations = 5;
    // Deposit enabled at in Unix milliseconds.
    int64 deposit_enabled_at = 6;
    // Min withdraw limit (decimal string).
    string min_withdraw = 7 [(schema.decimal) = true];
    // Withdraw enabled at in Unix milliseconds.
    int64 withdraw_enabled_at = 8;
    // Configured withdraw fee (non-negative decimal string).
    string withdraw_fee = 9 [(schema.decimal) = true];
  }
  // DomainProposerSetUpdated payload.
  message DomainProposerSetUpdated {
    // Domain.
    PermissionDomain domain = 1;
    // Config.
    ProposerSetConfig config = 2;
  }
  // SpotSymbolMetadataChanged payload.
  message SpotSymbolMetadataChanged {
    // Base token id.
    uint32 base_token = 1;
    // Quote token id.
    uint32 quote_token = 2;
    // Spot symbol open time in Unix milliseconds.
    int64 open_time = 3;
    // Spot symbol close time in Unix milliseconds.
    int64 close_time = 4;
    // Tick size as decimal string.
    string tick_size = 5 [(schema.decimal) = true];
    // Lot size as decimal string.
    string lot_size = 6 [(schema.decimal) = true];
    // Min size limit (decimal string).
    string min_size = 7 [(schema.decimal) = true];
    // Max number of order each match.
    uint32 max_number_of_order_each_match = 8;
    // Max number of order each account.
    uint32 max_number_of_order_each_account = 9;
    // Price limit bound as decimal string.
    string price_limit_bound = 10 [(schema.decimal) = true];
    // Min notional limit (decimal string).
    string min_notional = 11 [(schema.decimal) = true];
    // Status enum/int value after change.
    SymbolStatus status = 12;
    // Max notional limit (decimal string).
    string max_notional = 13 [(schema.decimal) = true];
    // Conditional price limit bound as decimal string.
    string conditional_price_limit_bound = 14 [(schema.decimal) = true];
  }
  // PredictionConfigUpdated payload.
  message PredictionConfigUpdated {
    // Create market bond amount as decimal string.
    string create_market_bond_amount = 1 [(schema.decimal) = true];
    // Proposal bond amount as decimal string.
    string proposal_bond_amount = 2 [(schema.decimal) = true];
    // Dispute bond amount as decimal string.
    string dispute_bond_amount = 3 [(schema.decimal) = true];
    // Dispute duration.
    int64 dispute_duration = 4;
    // Min event expire duration.
    int64 min_event_expire_duration = 5;
    // Max event expire duration.
    int64 max_event_expire_duration = 6;
    // Max number of order each match.
    uint32 max_number_of_order_each_match = 7;
    // Max orders per account.
    uint32 max_orders_per_account = 8;
    // Fee exponent.
    uint32 fee_exponent = 9;
  }
  // PredictionEventCreated payload.
  message PredictionEventCreated {
    // Prediction event id.
    uint64 event_id = 1;
    // Created by address (20-byte EVM address).
    bytes created_by = 2 [(schema.address) = true];
    // List of yes token ids.
    repeated uint32 yes_token_ids = 3;
    // List of no token ids.
    repeated uint32 no_token_ids = 4;
    // Deadline in Unix milliseconds.
    int64 deadline = 5;
    // Master account address (20-byte) if this account is a subaccount; omitted
    // otherwise.
    optional bytes master_account = 6 [(schema.address) = true];
  }
  // PredictionMarketEnded payload.
  message PredictionMarketEnded {
    // Prediction event id.
    uint64 event_id = 1;
    // List of yes token ids.
    repeated uint32 yes_token_ids = 2;
    // List of no token ids.
    repeated uint32 no_token_ids = 3;
  }
  // PredictionOutcomeProposed payload.
  message PredictionOutcomeProposed {
    // Prediction event id.
    uint64 event_id = 1;
    // YES token id.
    uint32 yes_token_id = 2;
    // NO token id.
    uint32 no_token_id = 3;
    // Proposal bond amount as decimal string.
    string proposal_bond_amount = 4 [(schema.decimal) = true];
    // Dispute deadline in Unix milliseconds.
    int64 dispute_deadline = 5;
    // Master account address (20-byte) if this account is a subaccount; omitted
    // otherwise.
    optional bytes master_account = 6 [(schema.address) = true];
    // Proposed outcome.
    PredictionOutcome proposed_outcome = 7;
  }
  // PredictionOutcomeDisputed payload.
  message PredictionOutcomeDisputed {
    // Prediction event id.
    uint64 event_id = 1;
    // YES token id.
    uint32 yes_token_id = 2;
    // NO token id.
    uint32 no_token_id = 3;
    // Dispute bond amount as decimal string.
    string dispute_bond_amount = 4 [(schema.decimal) = true];
    // Master account address (20-byte) if this account is a subaccount; omitted
    // otherwise.
    optional bytes master_account = 5 [(schema.address) = true];
  }
  // PredictionDisputeResolved payload.
  message PredictionDisputeResolved {
    // Prediction event id.
    uint64 event_id = 1;
    // YES token id.
    uint32 yes_token_id = 2;
    // NO token id.
    uint32 no_token_id = 3;
    // Final candidate outcome.
    PredictionOutcome final_candidate_outcome = 4;
    // Proposal id hash bytes (32-byte where applicable).
    bytes proposal_id = 5 [(schema.hash) = true];
    // Master account address (20-byte) if this account is a subaccount; omitted
    // otherwise.
    optional bytes master_account = 6 [(schema.address) = true];
  }
  // PredictionEventResolved payload.
  message PredictionEventResolved {
    // MarketOutcome payload.
    message MarketOutcome {
      // YES token id.
      uint32 yes_token_id = 1;
      // NO token id.
      uint32 no_token_id = 2;
      // Prediction outcome value.
      PredictionOutcome outcome = 3;
    }
    // Prediction event id.
    uint64 event_id = 1;
    // List of markets.
    repeated MarketOutcome markets = 2;
  }
  // PredictionEventSettled payload.
  message PredictionEventSettled {
    // Prediction event id.
    uint64 event_id = 1;
  }
  // PredictionMarketSettled payload.
  message PredictionMarketSettled {
    // Prediction event id.
    uint64 event_id = 1;
    // YES token id.
    uint32 yes_token_id = 2;
    // NO token id.
    uint32 no_token_id = 3;
    // Prediction outcome value.
    PredictionOutcome outcome = 4;
  }
  // PredictionSlashedBondDistributionUpdated payload.
  message PredictionSlashedBondDistributionUpdated {
    // Prediction event id.
    uint64 event_id = 1;
    // YES token id.
    uint32 yes_token_id = 2;
    // NO token id.
    uint32 no_token_id = 3;
    // Remaining distributable amount. Non-negative decimal string.
    string remaining_amount = 4 [(schema.decimal) = true];
    // Eligible recipient count.
    uint32 eligible_recipient_count = 5;
    // Distributed recipient count.
    uint32 distributed_recipient_count = 6;
    // Whether completed.
    bool completed = 7;
  }
  // Union of concrete change variants.
  oneof change {
    // Oneof variant for change: chain enabled.
    ChainEnabled chain_enabled = 1;
    // Oneof variant for change: chain disabled.
    ChainDisabled chain_disabled = 2;
    // Oneof variant for change: token metadata changed.
    TokenMetadataChanged token_metadata_changed = 3;
    // Oneof variant for change: risk limits registered.
    RiskLimitsRegistered risk_limits_registered = 4;
    // Oneof variant for change: symbol metadata changed.
    SymbolMetadataChanged symbol_metadata_changed = 5;
    // Oneof variant for change: fee tier changed.
    FeeTierChanged fee_tier_changed = 6;
    // Oneof variant for change: agent approved.
    AgentApproved agent_approved = 7;
    // Oneof variant for change: agent revoked.
    AgentRevoked agent_revoked = 8;
    // Oneof variant for change: agent expired.
    AgentExpired agent_expired = 9;
    // Oneof variant for change: account fee tier changed.
    AccountFeeTierChanged account_fee_tier_changed = 10;
    // Oneof variant for change: multisig converted.
    MultisigConverted multisig_converted = 11;
    // Oneof variant for change: multisig config updated.
    MultisigConfigUpdated multisig_config_updated = 12;
    // Oneof variant for change: multisig disabled.
    MultisigDisabled multisig_disabled = 13;
    // Oneof variant for change: deposit withdraw config updated.
    DepositWithdrawConfigUpdated deposit_withdraw_config_updated = 14;
    // Oneof variant for change: subaccount created.
    SubaccountCreated subaccount_created = 15;
    // Oneof variant for change: domain proposer set updated.
    DomainProposerSetUpdated domain_proposer_set_updated = 16;
    // Oneof variant for change: spot symbol metadata changed.
    SpotSymbolMetadataChanged spot_symbol_metadata_changed = 17;
    // Oneof variant for change: prediction config updated.
    PredictionConfigUpdated prediction_config_updated = 18;
    // Oneof variant for change: prediction event created.
    PredictionEventCreated prediction_event_created = 19;
    // Oneof variant for change: prediction market ended.
    PredictionMarketEnded prediction_market_ended = 20;
    // Oneof variant for change: prediction outcome proposed.
    PredictionOutcomeProposed prediction_outcome_proposed = 21;
    // Oneof variant for change: prediction outcome disputed.
    PredictionOutcomeDisputed prediction_outcome_disputed = 22;
    // Oneof variant for change: prediction dispute resolved.
    PredictionDisputeResolved prediction_dispute_resolved = 23;
    // Oneof variant for change: prediction event resolved.
    PredictionEventResolved prediction_event_resolved = 24;
    // Oneof variant for change: prediction event settled.
    PredictionEventSettled prediction_event_settled = 25;
    // Oneof variant for change: prediction market settled.
    PredictionMarketSettled prediction_market_settled = 26;
    // Oneof variant for change: prediction slashed-bond distribution updated.
    PredictionSlashedBondDistributionUpdated
        prediction_slashed_bond_distribution_updated = 27;
  }
}

// Order lifecycle change list.
message OrderChange {
  // Ordered list of change entries.
  repeated OrderChangeEntry changes = 1;
}

// One order lifecycle change entry.
message OrderChangeEntry {
  // Resolved trailing-order parameters snapshot stored in change events.
  message TrailingParams {
    // Trigger direction.
    TriggerDirection trigger_direction = 1;
    // Activation price as decimal string.
    optional string activation_price = 2 [(schema.decimal) = true];
    // Trailing base price as decimal string.
    optional string trailing_base_price = 3 [(schema.decimal) = true];
    // Trailing delta type.
    TrailingDeltaType trailing_delta_type = 4;
    // Trailing delta as decimal string.
    string trailing_delta = 5 [(schema.decimal) = true];
    // Trigger price as decimal string.
    optional string trigger_price = 6 [(schema.decimal) = true];
    // Trigger order type.
    OrderType trigger_order_type = 7;
    // Time in force.
    OrderTimeInForce time_in_force = 8;
    // Limit price used only when trigger_order_type = LIMIT.
    optional string price = 9 [(schema.decimal) = true];
    // Optional order size in base units. Must be > 0 when provided.
    optional string size = 10 [(schema.decimal) = true];
    // Whether reduce only.
    bool reduce_only = 11;
    // Stp mode.
    SelfTradePreventionMode stp_mode = 12;
    // Quote size as decimal string.
    optional string quote_size = 13 [(schema.decimal) = true];
  }
  // OrderPlaced payload.
  message OrderPlaced {
    // Entity identifier.
    uint64 id = 1;
    // Account address (20-byte EVM address).
    bytes account = 2 [(schema.address) = true];
    // TradingDomain=Perp: perpetual symbol base token.
    // TradingDomain=Spot: spot trading pair base token.
    // TradingDomain=Prediction: YES token id of the prediction market.
    uint32 base_token = 3;
    // TradingDomain=Perp: perpetual symbol quote token.
    // TradingDomain=Spot: spot trading pair quote token.
    // TradingDomain=Prediction: NO token id of the prediction market.
    uint32 quote_token = 4;
    // Position mode.
    PositionMode mode = 5;
    // Position/order side.
    PositionSide side = 6;
    // Type classification for this payload.
    OrderType type = 7;
    // Time in force.
    OrderTimeInForce time_in_force = 8;
    // Price as decimal string.
    optional string price = 9 [(schema.decimal) = true];
    // Size as decimal string.
    optional string size = 10 [(schema.decimal) = true];
    // Whether reduce only.
    bool reduce_only = 11;
    // Position id.
    optional uint64 position_id = 12;
    // Taker fee rate. Decimal ratio in [0, 1].
    string taker_fee_rate = 13 [(schema.decimal) = true];
    // Maker fee rate. Decimal ratio in [-taker_fee_rate, 1].
    string make_fee_rate = 14 [(schema.decimal) = true];

    // Trigger.
    optional TriggerParamsMessage trigger = 15;
    // Tp.
    optional TriggerParamsMessage tp = 16;
    // Sl.
    optional TriggerParamsMessage sl = 17;
    // Whether tp triggered.
    bool tp_triggered = 18;
    // Trailing.
    optional TrailingParams trailing = 19;
    // Stp mode.
    SelfTradePreventionMode stp_mode = 20;
    // Client order id.
    optional bytes client_order_id = 21;
    // Whether liquidation order.
    bool liquidation_order = 22;
    // Insurance fund cover as decimal string.
    optional string insurance_fund_cover = 23 [(schema.decimal) = true];
    // Master account address (20-byte) if this account is a subaccount; omitted
    // otherwise.
    optional bytes master_account = 24 [(schema.address) = true];
    // Strategy id.
    uint64 strategy_id = 25;
    // Trading domain where this change applies.
    TradingDomain trading_domain = 26;
    // Quote size as decimal string.
    optional string quote_size = 27 [(schema.decimal) = true];
    // Only valid when trading_domain = Prediction; indicates the traded
    // outcome.
    optional PredictionOutcome outcome = 28;
    // Only valid when trading_domain = Prediction.
    optional uint64 event_id = 29;
  }
  // OrderCancelled payload.
  message OrderCancelled {
    // Entity identifier.
    uint64 id = 1;
    // Account address (20-byte EVM address).
    bytes account = 2 [(schema.address) = true];
    // TradingDomain=Perp: perpetual symbol base token.
    // TradingDomain=Spot: spot trading pair base token.
    // TradingDomain=Prediction: YES token id of the prediction market.
    uint32 base_token = 3;
    // TradingDomain=Perp: perpetual symbol quote token.
    // TradingDomain=Spot: spot trading pair quote token.
    // TradingDomain=Prediction: NO token id of the prediction market.
    uint32 quote_token = 4;
    // Position mode.
    PositionMode mode = 5;
    // Position/order side.
    PositionSide side = 6;
    // Type classification for this payload.
    OrderType type = 7;
    // Cancelled remaining size (positive decimal).
    optional string size = 8 [(schema.decimal) = true];
    // Client order id.
    optional bytes client_order_id = 9;
    // Price as decimal string.
    optional string price = 10 [(schema.decimal) = true];
    // Master account address (20-byte) if this account is a subaccount; omitted
    // otherwise.
    optional bytes master_account = 11 [(schema.address) = true];
    // Strategy id.
    uint64 strategy_id = 12;
    // Trading domain where this change applies.
    TradingDomain trading_domain = 13;
    // Only valid when trading_domain = Prediction; indicates the cancelled
    // order's outcome.
    optional PredictionOutcome outcome = 14;
    // Only valid when trading_domain = Prediction.
    optional uint64 event_id = 15;
  }
  // OrderExpired payload.
  message OrderExpired {
    // Entity identifier.
    uint64 id = 1;
    // Account address (20-byte EVM address).
    bytes account = 2 [(schema.address) = true];
    // TradingDomain=Perp: perpetual symbol base token.
    // TradingDomain=Spot: spot trading pair base token.
    // TradingDomain=Prediction: YES token id of the prediction market.
    uint32 base_token = 3;
    // TradingDomain=Perp: perpetual symbol quote token.
    // TradingDomain=Spot: spot trading pair quote token.
    // TradingDomain=Prediction: NO token id of the prediction market.
    uint32 quote_token = 4;
    // Position mode.
    PositionMode mode = 5;
    // Position/order side.
    PositionSide side = 6;
    // Type classification for this payload.
    OrderType type = 7;
    // Expired remaining size (positive decimal).
    optional string size = 8 [(schema.decimal) = true];
    // Client order id.
    optional bytes client_order_id = 9;
    // Price as decimal string.
    optional string price = 10 [(schema.decimal) = true];
    // Master account address (20-byte) if this account is a subaccount; omitted
    // otherwise.
    optional bytes master_account = 11 [(schema.address) = true];
    // Strategy id.
    uint64 strategy_id = 12;
    // Trading domain where this change applies.
    TradingDomain trading_domain = 13;
    // Only valid when trading_domain = Prediction; indicates the expired
    // order's outcome.
    optional PredictionOutcome outcome = 14;
    // Only valid when trading_domain = Prediction.
    optional uint64 event_id = 15;
  }
  // OrderExecuted payload.
  message OrderExecuted {
    // TradingDomain=Perp: perpetual symbol base token.
    // TradingDomain=Spot: spot trading pair base token.
    // TradingDomain=Prediction: YES token id of the prediction market.
    uint32 base_token = 1;
    // TradingDomain=Perp: perpetual symbol quote token.
    // TradingDomain=Spot: spot trading pair quote token.
    // TradingDomain=Prediction: NO token id of the prediction market.
    uint32 quote_token = 2;
    // Taker order id.
    uint64 taker_order_id = 3;
    // Taker account address (20-byte EVM address).
    bytes taker_account = 4 [(schema.address) = true];
    // Taker mode.
    PositionMode taker_mode = 5;
    // Taker side.
    PositionSide taker_side = 6;

    // Execution price. Perp/spot use maker price. Prediction uses maker price
    // except taker complementary leg may use 1-maker price.
    string price = 7 [(schema.decimal) = true];
    // Executed size (positive decimal).
    string size = 8 [(schema.decimal) = true];

    // Taker fee delta. Always <= 0.
    string taker_fee = 9 [(schema.decimal) = true];
    // Whether taker order filled.
    bool taker_order_filled = 10;

    // Maker-side order fields.
    // Maker order id.
    uint64 maker_order_id = 11;
    // Maker account address (20-byte EVM address).
    bytes maker_account = 12 [(schema.address) = true];
    // Maker mode.
    PositionMode maker_mode = 13;
    // Maker fee delta. Positive = rebate received, negative = fee paid.
    string maker_fee = 14 [(schema.decimal) = true];
    // Whether maker order filled.
    bool maker_order_filled = 15;
    // Taker price as decimal string.
    string taker_price = 16 [(schema.decimal) = true];
    // Taker master account address (20-byte EVM address).
    optional bytes taker_master_account = 17 [(schema.address) = true];
    // Maker master account address (20-byte EVM address).
    optional bytes maker_master_account = 18 [(schema.address) = true];
    // True when this event row is from the taker perspective.
    bool taker = 19;
    // Taker strategy id.
    uint64 taker_strategy_id = 20;
    // Maker strategy id.
    uint64 maker_strategy_id = 21;
    // Trading domain where this change applies.
    TradingDomain trading_domain = 22;
    // Only valid when trading_domain = Prediction; indicates the outcome of the
    // order represented by this executed event (taker event => taker outcome,
    // maker event => maker outcome).
    optional PredictionOutcome outcome = 23;
    // Only valid when trading_domain = Prediction; indicates the prediction
    // match type.
    optional PredictionMatchType match_type = 24;
    // Only valid when trading_domain = Prediction.
    optional uint64 event_id = 25;
  }
  // OrderTriggerFailed payload.
  message OrderTriggerFailed {
    // Entity identifier.
    uint64 id = 1;
    // Account address (20-byte EVM address).
    bytes account = 2 [(schema.address) = true];
    // Base token id.
    uint32 base_token = 3;
    // Quote token id.
    uint32 quote_token = 4;
    // Position mode.
    PositionMode mode = 5;
    // Position/order side.
    PositionSide side = 6;
    // Type classification for this payload.
    OrderType type = 7;
    // Failure reason code for trigger processing.
    ErrorCode error_code = 8;
    // Client order id.
    optional bytes client_order_id = 9;
    // Whether tp triggered.
    bool tp_triggered = 10;
    // Master account address (20-byte) if this account is a subaccount; omitted
    // otherwise.
    optional bytes master_account = 11 [(schema.address) = true];
    // Trading domain where this change applies.
    TradingDomain trading_domain = 12;
  }
  // OrderTriggerSucceeded payload.
  message OrderTriggerSucceeded {
    // Entity identifier.
    uint64 id = 1;
    // Account address (20-byte EVM address).
    bytes account = 2 [(schema.address) = true];
    // Base token id.
    uint32 base_token = 3;
    // Quote token id.
    uint32 quote_token = 4;
    // Position mode.
    PositionMode mode = 5;
    // Position/order side.
    PositionSide side = 6;
    // Type classification for this payload.
    OrderType type = 7;
    // Triggered order id.
    uint64 triggered_order_id = 8;
    // Client order id.
    optional bytes client_order_id = 9;
    // Whether tp triggered.
    bool tp_triggered = 10;
    // Master account address (20-byte) if this account is a subaccount; omitted
    // otherwise.
    optional bytes master_account = 11 [(schema.address) = true];
    // Trading domain where this change applies.
    TradingDomain trading_domain = 12;
  }
  // OrderAmended payload.
  message OrderAmended {
    // Entity identifier.
    uint64 id = 1;
    // Account address (20-byte EVM address).
    bytes account = 2 [(schema.address) = true];
    // Base token id.
    uint32 base_token = 3;
    // Quote token id.
    uint32 quote_token = 4;
    // Position mode.
    PositionMode mode = 5;
    // Position/order side.
    PositionSide side = 6;
    // Type classification for this payload.
    OrderType type = 7;
    // Price after this change (decimal string).
    string price_after = 8 [(schema.decimal) = true];
    // Size after this change (decimal string).
    string size_after = 9 [(schema.decimal) = true];
    // Client order id.
    optional bytes client_order_id = 10;
    // Price as decimal string.
    string price = 11 [(schema.decimal) = true];
    // Size as decimal string.
    string size = 12 [(schema.decimal) = true];
    // Filled amount snapshot (base units). Meaningful for limit orders.
    optional string filled = 13 [(schema.decimal) = true];
    // Seq.
    uint64 seq = 14;
    // Trigger.
    optional TriggerParamsMessage trigger = 15;
    // Tp.
    optional TriggerParamsMessage tp = 16;
    // Sl.
    optional TriggerParamsMessage sl = 17;
    // Master account address (20-byte) if this account is a subaccount; omitted
    // otherwise.
    optional bytes master_account = 18 [(schema.address) = true];
    // Trading domain where this change applies.
    TradingDomain trading_domain = 19;
  }
  // OrderFeeRateChanged payload.
  message OrderFeeRateChanged {
    // Entity identifier.
    uint64 id = 1;
    // Account address (20-byte EVM address).
    bytes account = 2 [(schema.address) = true];
    // Base token id.
    uint32 base_token = 3;
    // Quote token id.
    uint32 quote_token = 4;
    // Position mode.
    PositionMode mode = 5;
    // Position/order side.
    PositionSide side = 6;
    // Type classification for this payload.
    OrderType type = 7;
    // Taker fee rate. Decimal ratio in [0, 1].
    string taker_fee_rate = 8 [(schema.decimal) = true];
    // Maker fee rate. Decimal ratio in [-taker_fee_rate, 1].
    string maker_fee_rate = 9 [(schema.decimal) = true];
    // Client order id.
    optional bytes client_order_id = 10;
    // Master account address (20-byte) if this account is a subaccount; omitted
    // otherwise.
    optional bytes master_account = 11 [(schema.address) = true];
    // Trading domain where this change applies.
    TradingDomain trading_domain = 12;
  }
  // StrategyCreated payload.
  message StrategyCreated {
    // Strategy id.
    uint64 strategy_id = 1;
    // Account address (20-byte EVM address).
    bytes account = 2 [(schema.address) = true];
    // Master account address (20-byte) if this account is a subaccount; omitted
    // otherwise.
    optional bytes master_account = 3 [(schema.address) = true];
    // Template type.
    StrategyTemplateType template_type = 4;
    // Status enum/int value after change.
    StrategyInstanceStatus status = 5;
    // Union of concrete params variants.
    oneof params {
      // Oneof variant for params: twap params.
      TwapStrategyParamsMessage twap_params = 6;
      // Oneof variant for params: iceberg params.
      IcebergStrategyParamsMessage iceberg_params = 7;
      // Oneof variant for params: spot twap params.
      SpotTwapStrategyParamsMessage spot_twap_params = 11;
      // Oneof variant for params: spot iceberg params.
      SpotIcebergStrategyParamsMessage spot_iceberg_params = 12;
    }
    // Base token id.
    uint32 base_token = 8;
    // Quote token id.
    uint32 quote_token = 9;
    // Trading domain where this change applies.
    TradingDomain trading_domain = 10;
  }
  // StrategyStatusChanged payload.
  message StrategyStatusChanged {
    // Strategy id.
    uint64 strategy_id = 1;
    // Account address (20-byte EVM address).
    bytes account = 2 [(schema.address) = true];
    // Master account address (20-byte) if this account is a subaccount; omitted
    // otherwise.
    optional bytes master_account = 3 [(schema.address) = true];
    // Status enum/int value after change.
    StrategyInstanceStatus status = 4;
    // Base token id.
    uint32 base_token = 5;
    // Quote token id.
    uint32 quote_token = 6;
    // Trading domain where this change applies.
    TradingDomain trading_domain = 7;
  }
  // SymbolClosed payload.
  message SymbolClosed {
    // Trading domain where this change applies.
    TradingDomain trading_domain = 1;
    // Base token id.
    uint32 base_token = 2;
    // Quote token id.
    uint32 quote_token = 3;
    // Prediction event id.
    uint64 event_id = 4;
  }
  // PredictionChanceChanged payload.
  message PredictionChanceChanged {
    // YES token id.
    uint32 yes_token_id = 1;
    // NO token id.
    uint32 no_token_id = 2;
    // Chance as decimal string.
    string chance = 3 [(schema.decimal) = true];
    // Prediction event id.
    uint64 event_id = 4;
  }

  // Union of concrete change variants.
  oneof change {
    // Oneof variant for change: placed.
    OrderPlaced placed = 1;
    // Oneof variant for change: cancelled.
    OrderCancelled cancelled = 2;
    // Oneof variant for change: expired.
    OrderExpired expired = 3;
    // Oneof variant for change: executed.
    OrderExecuted executed = 4;
    // Oneof variant for change: trigger failed.
    OrderTriggerFailed trigger_failed = 5;
    // Oneof variant for change: trigger succeeded.
    OrderTriggerSucceeded trigger_succeeded = 6;
    // Oneof variant for change: amended.
    OrderAmended amended = 7;
    // Oneof variant for change: fee rate changed.
    OrderFeeRateChanged fee_rate_changed = 8;
    // Oneof variant for change: strategy created.
    StrategyCreated strategy_created = 9;
    // Oneof variant for change: strategy status changed.
    StrategyStatusChanged strategy_status_changed = 10;
    // Oneof variant for change: symbol closed.
    SymbolClosed symbol_closed = 11;
    // Oneof variant for change: prediction chance changed.
    PredictionChanceChanged prediction_chance_changed = 12;
  }
}

// Cause classification for spot position size changes.
enum SpotPositionChangeType {
  // Default zero value.
  SPOT_CHANGE_UNSPECIFIED = 0;
  // Spot increase caused by buy-side trade fill.
  SPOT_CHANGE_LONG = 1;
  // Spot decrease caused by sell-side trade fill.
  SPOT_CHANGE_SHORT = 2;
  // Spot increase caused by deposit.
  SPOT_CHANGE_DEPOSIT = 3;
  // Spot decrease caused by confirmed withdraw.
  SPOT_CHANGE_WITHDRAW = 4;
  // Spot increase caused by transfer-in.
  SPOT_CHANGE_TRANSFER_IN = 5;
  // Spot decrease caused by transfer-out.
  SPOT_CHANGE_TRANSFER_OUT = 6;
}

// Position lifecycle change list.
message PositionChange {
  // Ordered list of change entries.
  repeated PositionChangeEntry changes = 1;
}

// One position lifecycle change entry.
message PositionChangeEntry {
  // PositionIncreased payload.
  message PositionIncreased {
    // Entity identifier.
    uint64 id = 1;
    // Account address (20-byte EVM address).
    bytes account = 2 [(schema.address) = true];
    // Base token id.
    uint32 base_token = 3;
    // Quote token id.
    uint32 quote_token = 4;
    // Position mode.
    PositionMode mode = 5;
    // Position/order side.
    PositionSide side = 6;
    // Filled size as decimal string.
    string filled_size = 7 [(schema.decimal) = true];
    // Size after this change (decimal string).
    string size_after = 8 [(schema.decimal) = true];
    // Filled price as decimal string.
    string filled_price = 9 [(schema.decimal) = true];
    // Entry price after this change (decimal string).
    string entry_price_after = 10 [(schema.decimal) = true];
    // Fee delta for this fill. Positive = rebate/credit, negative = fee paid.
    string fee = 11 [(schema.decimal) = true];
    // Realized pnl after this change (decimal string).
    string realized_pnl_after = 12 [(schema.decimal) = true];
    // Isolated margin after this change (decimal string).
    optional string isolated_margin_after = 13 [(schema.decimal) = true];
    // Taker fee rate. Decimal ratio in [0, 1].
    string taker_fee_rate = 14 [(schema.decimal) = true];
    // Risk limits id.
    uint32 risk_limits_id = 15;
    // Funding growth as decimal string.
    string funding_growth = 16 [(schema.decimal) = true];
    // Leverage.
    uint32 leverage = 17;
    // Master account address (20-byte) if this account is a subaccount; omitted
    // otherwise.
    optional bytes master_account = 18 [(schema.address) = true];
  }
  // PositionDecreased payload.
  message PositionDecreased {
    // Entity identifier.
    uint64 id = 1;
    // Account address (20-byte EVM address).
    bytes account = 2 [(schema.address) = true];
    // Base token id.
    uint32 base_token = 3;
    // Quote token id.
    uint32 quote_token = 4;
    // Position mode.
    PositionMode mode = 5;
    // Position/order side.
    PositionSide side = 6;
    // Filled size as decimal string.
    string filled_size = 7 [(schema.decimal) = true];
    // Size after this change (decimal string).
    string size_after = 8 [(schema.decimal) = true];
    // Filled price as decimal string.
    string filled_price = 9 [(schema.decimal) = true];
    // Fee delta for this fill. Positive = rebate/credit, negative = fee paid.
    string fee = 10 [(schema.decimal) = true];
    // Close-only realized PnL from execution price movement; fees are excluded.
    string realized_pnl = 11 [(schema.decimal) = true];
    // Realized pnl after this change (decimal string).
    string realized_pnl_after = 12 [(schema.decimal) = true];
    // Isolated margin after this change (decimal string).
    optional string isolated_margin_after = 13 [(schema.decimal) = true];
    // True when the close is caused by liquidation flow.
    bool liquidation_order = 14;
    // Leverage.
    uint32 leverage = 17;
    // Whether adl.
    bool adl = 18;
    // Master account address (20-byte) if this account is a subaccount; omitted
    // otherwise.
    optional bytes master_account = 19 [(schema.address) = true];
  }
  // PositionFundingSettled payload.
  message PositionFundingSettled {
    // Entity identifier.
    uint64 id = 1;
    // Account address (20-byte EVM address).
    bytes account = 2 [(schema.address) = true];
    // Base token id.
    uint32 base_token = 3;
    // Quote token id.
    uint32 quote_token = 4;
    // Position mode.
    PositionMode mode = 5;
    // Position/order side.
    PositionSide side = 6;
    // Funding growth as decimal string.
    string funding_growth = 10 [(schema.decimal) = true];
    // Funding fee delta. Positive = received, negative = paid.
    string funding_fee = 11 [(schema.decimal) = true];
    // Isolated margin after this change (decimal string).
    optional string isolated_margin_after = 12 [(schema.decimal) = true];
    // Master account address (20-byte) if this account is a subaccount; omitted
    // otherwise.
    optional bytes master_account = 13 [(schema.address) = true];
    // Size as decimal string.
    string size = 14 [(schema.decimal) = true];
    // Leverage.
    uint32 leverage = 15;
    // Realized pnl after this change (decimal string).
    string realized_pnl_after = 16 [(schema.decimal) = true];
  }
  // PositionModeChanged payload.
  message PositionModeChanged {
    // Account address (20-byte EVM address).
    bytes account = 1 [(schema.address) = true];
    // Base token id.
    uint32 base_token = 2;
    // Quote token id.
    uint32 quote_token = 3;
    // Position mode.
    PositionMode mode = 4;
    // Isolated leverage.
    uint32 isolated_leverage = 5;
    // Cross leverage.
    uint32 cross_leverage = 6;
  }
  // PositionMarginIncreased payload.
  message PositionMarginIncreased {
    // Entity identifier.
    uint64 id = 1;
    // Account address (20-byte EVM address).
    bytes account = 2 [(schema.address) = true];
    // Base token id.
    uint32 base_token = 3;
    // Quote token id.
    uint32 quote_token = 4;
    // Position/order side.
    PositionSide side = 5;
    // Isolated margin increase amount. Always positive.
    string amount = 6 [(schema.decimal) = true];
    // Isolated margin after this change (decimal string).
    string isolated_margin_after = 7 [(schema.decimal) = true];
    // Master account address (20-byte) if this account is a subaccount; omitted
    // otherwise.
    optional bytes master_account = 8 [(schema.address) = true];
  }
  // PositionMarginDecreased payload.
  message PositionMarginDecreased {
    // Entity identifier.
    uint64 id = 1;
    // Account address (20-byte EVM address).
    bytes account = 2 [(schema.address) = true];
    // Base token id.
    uint32 base_token = 3;
    // Quote token id.
    uint32 quote_token = 4;
    // Position/order side.
    PositionSide side = 5;
    // Isolated margin decrease amount in event sign convention. Always
    // negative.
    string amount = 6 [(schema.decimal) = true];
    // Isolated margin after this change (decimal string).
    string isolated_margin_after = 7 [(schema.decimal) = true];
    // Master account address (20-byte) if this account is a subaccount; omitted
    // otherwise.
    optional bytes master_account = 8 [(schema.address) = true];
  }
  // PositionLeverageChanged payload.
  message PositionLeverageChanged {
    // Entity identifier.
    uint64 id = 1;
    // Account address (20-byte EVM address).
    bytes account = 2 [(schema.address) = true];
    // Base token id.
    uint32 base_token = 3;
    // Quote token id.
    uint32 quote_token = 4;
    // Margin delta caused by leverage change. Positive = margin added, negative
    // = margin released.
    string amount = 5 [(schema.decimal) = true];
    // Isolated margin after this change (decimal string).
    string isolated_margin_after = 6 [(schema.decimal) = true];
    // Position mode.
    PositionMode mode = 7;
    // Leverage.
    uint32 leverage = 8;
    // Master account address (20-byte) if this account is a subaccount; omitted
    // otherwise.
    optional bytes master_account = 9 [(schema.address) = true];
  }
  // PositionStatusChanged payload.
  message PositionStatusChanged {
    // Entity identifier.
    uint64 id = 1;
    // Account address (20-byte EVM address).
    bytes account = 2 [(schema.address) = true];
    // Base token id.
    uint32 base_token = 3;
    // Quote token id.
    uint32 quote_token = 4;
    // Position mode.
    PositionMode mode = 5;
    // Position/order side.
    PositionSide side = 6;
    // Status enum/int value after change.
    PositionStatus status = 7;
    // Master account address (20-byte) if this account is a subaccount; omitted
    // otherwise.
    optional bytes master_account = 8 [(schema.address) = true];
  }

  // Spot position increase (buy / deposit / transfer-in).
  message SpotPositionIncreased {
    // Account address (20-byte EVM address).
    bytes account = 1 [(schema.address) = true];
    // Master account address (20-byte) if this account is a subaccount; omitted
    // otherwise.
    optional bytes master_account = 2 [(schema.address) = true];
    // Base/target token id whose position increased.
    uint32 base_token = 3;
    // Quote token id of the trading pair. Zero for non-trade changes
    // (deposit/transfer-in).
    uint32 quote_token = 4;
    // Type classification for this payload.
    SpotPositionChangeType type = 5;
    // Increase size (positive decimal).
    string size = 6 [(schema.decimal) = true];
    // USD reference price for valuation (if available).
    string usd_price = 7 [(schema.decimal) = true];
    // Fee delta for this spot position increase. Positive = rebate/credit,
    // negative = fee paid.
    optional string fee = 8 [(schema.decimal) = true];
    // Fee token.
    optional uint32 fee_token = 9;
    // USD value of fee delta. Positive = rebate/credit, negative = fee paid.
    optional string fee_usd_value = 10 [(schema.decimal) = true];
  }

  // Spot position decrease (sell / confirmed withdraw / transfer-out).
  message SpotPositionDecreased {
    // Account address (20-byte EVM address).
    bytes account = 1 [(schema.address) = true];
    // Master account address (20-byte) if this account is a subaccount; omitted
    // otherwise.
    optional bytes master_account = 2 [(schema.address) = true];
    // Base token id.
    uint32 base_token = 3;
    // Quote token id of the trading pair. Zero for non-trade changes
    // (confirmed withdraw / transfer-out).
    uint32 quote_token = 4;
    // Type classification for this payload.
    SpotPositionChangeType type = 5;
    // Decrease size (positive decimal).
    string size = 6 [(schema.decimal) = true];
    // USD reference price for valuation (if available).
    string usd_price = 7 [(schema.decimal) = true];
    // Realized PnL delta for this decrease. Positive = profit, negative = loss.
    // Trade/transfer-out paths exclude
    // fees; confirmed-withdraw includes withdraw-fee impact.
    string realized_pnl = 8 [(schema.decimal) = true];
    // Fee delta for this spot position decrease. Positive = rebate/credit,
    // negative = fee paid.
    optional string fee = 9 [(schema.decimal) = true];
    // Fee token.
    optional uint32 fee_token = 10;
    // USD value of fee delta. Positive = rebate/credit, negative = fee paid.
    optional string fee_usd_value = 11 [(schema.decimal) = true];
  }

  // Union of concrete change variants.
  oneof change {
    // Oneof variant for change: increased.
    PositionIncreased increased = 1;
    // Oneof variant for change: decreased.
    PositionDecreased decreased = 2;
    // Oneof variant for change: funding settled.
    PositionFundingSettled funding_settled = 3;
    // Oneof variant for change: mode changed.
    PositionModeChanged mode_changed = 4;
    // Oneof variant for change: margin increased.
    PositionMarginIncreased margin_increased = 5;
    // Oneof variant for change: margin decreased.
    PositionMarginDecreased margin_decreased = 6;
    // Oneof variant for change: leverage changed.
    PositionLeverageChanged leverage_changed = 7;
    // Oneof variant for change: status changed.
    PositionStatusChanged status_changed = 8;
    // Oneof variant for change: spot increased.
    SpotPositionIncreased spot_increased = 9;
    // Oneof variant for change: spot decreased.
    SpotPositionDecreased spot_decreased = 10;
  }
}

// Vault state change list.
message VaultChange {
  // Ordered list of change entries.
  repeated VaultChangeEntry changes = 1;
}

// One vault state change entry.
message VaultChangeEntry {
  // VaultCreated payload.
  message VaultCreated {
    // Name.
    string name = 1;
    // Description.
    string description = 2;
    // Leader fee rate. Decimal ratio in [0, 1].
    string leader_fee_rate = 3 [(schema.decimal) = true];
    // Leader address (20-byte EVM address).
    bytes leader = 4 [(schema.address) = true];
    // Vault account address (20-byte EVM address).
    bytes vault_account = 5 [(schema.address) = true];
    // Whether deposit enabled.
    bool deposit_enabled = 6;
    // Auto-close-on-withdraw policy flag.
    bool auto_close_on_withdraw = 7;
  }
  // VaultDeposited payload.
  message VaultDeposited {
    // Vault account address (20-byte EVM address).
    bytes vault_account = 1 [(schema.address) = true];
    // Shares after this change (decimal string).
    string shares_after = 2 [(schema.decimal) = true];
    // Net deposit after this change (decimal string).
    string net_deposit_after = 3 [(schema.decimal) = true];
  }
  // VaultEpochUpdated payload.
  message VaultEpochUpdated {
    // Vault account address (20-byte EVM address).
    bytes vault_account = 1 [(schema.address) = true];
    // Epoch.
    int64 epoch = 2;
  }
  // VaultDepositorDeposited payload.
  message VaultDepositorDeposited {
    // Depositor address (20-byte EVM address).
    bytes depositor = 1 [(schema.address) = true];
    // Vault account address (20-byte EVM address).
    bytes vault_account = 2 [(schema.address) = true];
    // Deposit amount (positive decimal).
    string deposit_amount = 3 [(schema.decimal) = true];
    // Shares after this change (decimal string).
    string shares_after = 4 [(schema.decimal) = true];
    // Cost per share after this change (decimal string).
    string cost_per_share_after = 5 [(schema.decimal) = true];
    // Depositor epoch after this change.
    int64 epoch = 6;
  }
  // VaultDepositEnabledChanged payload.
  message VaultDepositEnabledChanged {
    // Vault account address (20-byte EVM address).
    bytes vault_account = 1 [(schema.address) = true];
    // Leader address (20-byte EVM address).
    bytes leader = 2 [(schema.address) = true];
    // Whether deposit enabled.
    bool deposit_enabled = 3;
  }
  // Emits when the vault auto_close_on_withdraw flag is updated.
  message VaultAutoCloseOnWithdrawChanged {
    // Vault account address (20-byte EVM address).
    bytes vault_account = 1 [(schema.address) = true];
    // Leader address (20-byte EVM address).
    bytes leader = 2 [(schema.address) = true];
    // Auto-close-on-withdraw policy flag.
    bool auto_close_on_withdraw = 3;
  }
  // VaultStatusChanged payload.
  message VaultStatusChanged {
    // Vault account address (20-byte EVM address).
    bytes vault_account = 1 [(schema.address) = true];
    // Leader address (20-byte EVM address).
    bytes leader = 2 [(schema.address) = true];
    // Status after change.
    VaultStatus status = 3;
    // Net deposit after status transition; populated when status becomes
    // closed.
    optional string net_deposit_after = 4 [(schema.decimal) = true];
  }
  // VaultDepositorWithdrew payload.
  message VaultDepositorWithdrew {
    // Depositor address (20-byte EVM address).
    bytes depositor = 1 [(schema.address) = true];
    // Vault account address (20-byte EVM address).
    bytes vault_account = 2 [(schema.address) = true];
    // Shares after this change (decimal string).
    string shares_after = 3 [(schema.decimal) = true];
    // Realized pnl delta. Positive = profit, negative = loss.
    string realized_pnl = 4 [(schema.decimal) = true];
    // Depositor epoch after this change.
    int64 epoch = 5;
  }
  // VaultWithdrew payload.
  message VaultWithdrew {
    // Vault account address (20-byte EVM address).
    bytes vault_account = 1 [(schema.address) = true];
    // Shares after this change (decimal string).
    string shares_after = 2 [(schema.decimal) = true];
    // Net deposit after this change (decimal string).
    string net_deposit_after = 3 [(schema.decimal) = true];
  }
  // Union of concrete change variants.
  oneof change {
    // Oneof variant for change: created.
    VaultCreated created = 1;
    // Oneof variant for change: deposited.
    VaultDeposited deposited = 2;
    // Oneof variant for change: epoch updated.
    VaultEpochUpdated epoch_updated = 3;
    // Oneof variant for change: depositor deposited.
    VaultDepositorDeposited depositor_deposited = 4;
    // Oneof variant for change: deposit enabled changed.
    VaultDepositEnabledChanged deposit_enabled_changed = 5;
    // Oneof variant for change: auto close on withdraw changed.
    VaultAutoCloseOnWithdrawChanged auto_close_on_withdraw_changed = 6;
    // Oneof variant for change: status changed.
    VaultStatusChanged status_changed = 7;
    // Oneof variant for change: depositor withdrew.
    VaultDepositorWithdrew depositor_withdrew = 8;
    // Oneof variant for change: withdrew.
    VaultWithdrew withdrew = 9;
  }
}
