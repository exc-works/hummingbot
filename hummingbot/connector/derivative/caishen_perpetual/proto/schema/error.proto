  TP_SL_TRAILING_NOT_ALLOWED_FOR_CONDITIONAL_ORDER = 1167;
  // Trigger or trailing parameters are not allowed for take-profit or stop-loss
  // orders.
  TP_SL_TRIGGER_TRAILING_NOT_ALLOWED = 1168;
  // Trailing take-profit and stop-loss orders cannot be configured with
  // trigger, TP, or SL parameters.
  TRAILING_MUTUALLY_EXCLUSIVE_PARAMS = 1169;
  // The price field is malformed and cannot be parsed.
  MALFORMED_PRICE = 1170;
  // The size field is malformed and cannot be parsed.
  MALFORMED_SIZE = 1171;
  // Trailing take-profit/stop-loss orders cannot be modified.
  TRAILING_ORDER_NOT_MODIFIABLE = 1172;
  // The min deposit field is malformed and cannot be parsed.
  MALFORMED_MIN_DEPOSIT = 1173;
  // The minimum withdrawal field is malformed and cannot be parsed.
