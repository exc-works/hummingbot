  LOT_SIZE_INVALID = 1273;
  // The minimum size is invalid.
  MIN_SIZE_INVALID = 1274;
  // The minimum size must be a multiple of the lot size.
  MIN_SIZE_NOT_MULTIPLE_OF_LOT_SIZE = 1275;
  // The value must not be negative.
  NON_NEGATIVE_VALUE_REQUIRED = 1276;
  // The vault is in maintenance and cannot perform this operation.
  VAULT_MAINTENANCE_IN_PROGRESS = 1277;
  // The vault share price has not reached the maintenance threshold.
  VAULT_MAINTENANCE_NOT_REQUIRED = 1278;
  // The vault has one or more running strategy instances. Stop all strategies
  // before closing or maintaining the vault.
  VAULT_HAS_RUNNING_STRATEGY = 1279;

  // Strategy-related error codes (starting from 5000).
  // The strategy template type is invalid.
  STRATEGY_INVALID_TEMPLATE_TYPE = 5000;
  // The TWAP price bound is invalid. It must be greater than zero.
  STRATEGY_TWAP_INVALID_PRICE_BOUND = 5001;
  // The TWAP price bound decimal precision exceeds the symbol's tick size
  // precision.
  STRATEGY_TWAP_PRICE_BOUND_DECIMALS_TOO_LARGE = 5002;
  // The TWAP time interval is invalid. It must be between 5 and 120 seconds.
  STRATEGY_TWAP_INVALID_TIME_INTERVAL = 5003;
  // The TWAP size per order is not a multiple of the symbol's lot size.
  STRATEGY_BAD_SIZE_PER_ORDER_LOT_MISMATCH = 5004;
  // The TWAP size per order decimal precision exceeds the symbol's size
  // precision.
  STRATEGY_SIZE_PER_ORDER_DECIMALS_TOO_LARGE = 5005;
  // The TWAP size per order is smaller than the symbol's minimum order size.
  STRATEGY_SIZE_PER_ORDER_TOO_SMALL = 5006;
  // The TWAP total size must be greater than or equal to the size per order.
  STRATEGY_TOTAL_SIZE_LESS_THAN_SIZE_PER_ORDER = 5007;
  // The TWAP total size decimal precision exceeds the symbol's size precision.
  STRATEGY_TOTAL_SIZE_DECIMALS_TOO_LARGE = 5008;
  // The TWAP total size is not a multiple of the symbol's lot size.
  STRATEGY_TOTAL_SIZE_LOT_MISMATCH = 5009;
  // The strategy instance was not found.
  STRATEGY_INSTANCE_NOT_FOUND = 5010;
  // The strategy instance is not in a stoppable state.
  STRATEGY_INSTANCE_ALREADY_STOPPED = 5011;

  // The number of concurrent orders for the Iceberg strategy exceeds the
  // maximum allowed value (5).
  STRATEGY_ICEBERG_SINGLE_ORDERS_TOO_LARGE = 5012;
  // The number of concurrent orders for the Iceberg strategy must be at
  // least 1.
  STRATEGY_ICEBERG_SINGLE_ORDERS_ZERO = 5013;
  // The price bound for the Iceberg strategy is invalid. It must be a
  // positive value.
  STRATEGY_ICEBERG_INVALID_PRICE_BOUND = 5014;
  // The price bound decimal precision for the Iceberg strategy exceeds the
  // symbol's tick size precision.
  STRATEGY_ICEBERG_PRICE_BOUND_DECIMALS_TOO_LARGE = 5015;
  // The trailing delta for the Iceberg strategy is invalid. It must be a
  // positive value and at least equal to the symbol's tick size.
  STRATEGY_ICEBERG_INVALID_TRAILING_DELTA = 5016;
  // The total size for the Iceberg strategy must be at least equal to
  // single_size multiplied by the number of concurrent orders.
  STRATEGY_ICEBERG_TOTAL_SIZE_LESS_THAN_MIN = 5017;
  // The account has reached the maximum number of concurrently running
  // strategies of this type (5). Stop an existing strategy of the same type
  // before creating a new one.
  STRATEGY_MAX_RUNNING_LIMIT_EXCEEDED = 5018;
  // The Iceberg strategy order preference is invalid.
  STRATEGY_ICEBERG_INVALID_ORDER_PREFERENCE = 5019;
  // The strategy size per order is not a valid number.
  STRATEGY_INVALID_SIZE_PER_ORDER = 5020;
  // The strategy total size is not a valid number.
  STRATEGY_INVALID_TOTAL_SIZE = 5021;
}

// Error is the canonical action-level error payload returned by action-result
// APIs.
message Error {
  // Machine-readable error code for programmatic handling.
  ErrorCode code = 1;
  // Human-readable message for display. Do not parse this field for logic;
  // use `code` instead.
  string message = 2;
  // Positional values referenced by `message` placeholders ({0}, {1}, ...),
  // such as the offending field name, symbol, or value. Provided so clients
  // can render their own localized message from `code`. The order for each
  // `code` is stable.
  repeated string args = 3;
}
