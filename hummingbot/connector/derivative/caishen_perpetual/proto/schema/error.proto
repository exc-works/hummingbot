  // The receiver is invalid.
  INVALID_RECEIVER = 1147;
  // The idempotency key is invalid.
  INVALID_IDEMPOTENCY_KEY = 1148;
  // The hash is invalid.
  INVALID_HASH = 1149;
  // The pending withdrawal was not found.
