  // The account type does not match.
  ACCOUNT_TYPE_MISMATCH = 1141;
  // The threshold is invalid.
  INVALID_THRESHOLD = 1142;
  // The agent address is invalid.
  INVALID_AGENT_ADDRESS = 1143;
  // The operation would cause the position to exceed the maximum leverage {0}
