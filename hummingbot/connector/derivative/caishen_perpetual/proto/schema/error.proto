syntax = "proto3";
package share.schema;

option go_package = "github.com/exc-works/caishen/share/schema";

import "schema/extensions.proto";

// ErrorCode defines protocol-level deterministic validation and execution
// failures. Numeric values are persisted and used in API responses.
enum ErrorCode {
  // Enables enum-to-message mapping derived from enum comments.
  option (schema.generate_messages) = true;
  // Success: the action was accepted and processed without error.
  NO_ERROR = 0;
  reserved 1 to 1000;
  // Removed unused error codes. Numeric IDs are kept reserved.
  reserved 1008, 1011, 1076, 1080 to 1081, 1084, 1098, 1113, 1118, 1151, 1161;
  reserved "NOT_PROPOSER", "INSUFFICIENT_SIGNATURES",
      "TAKER_FEE_RATE_MUST_NOT_NEGATIVE", "UPDATE_STALE_PRICE",
      "UNAPPROVED_AGENT", "AGENT_NOT_FOUND", "BAD_STOP_TYPE",
      "BAD_TRAILING_BASE_PRICE", "NOT_ENOUGH_ORDERS_TO_MATCH",
      "REDUCE_PRICE_OUT_OF_LIQUIDATION_PRICE", "NOT_PENDING_ORDER",
      "CALCULATE_BANKRUPTCY_PRICE_FAILED";
  // The specified recent block hash does not exist or has expired.
  RECENT_BLOCK_HASH_INVALID = 1001;
  // The recent block has not been finalized yet.
  RECENT_BLOCK_NOT_FINALIZED = 1002;
  // The transaction hash already exists.
  DUPLICATE_TRANSACTION_HASH = 1003;
  // Malformed data: the data is empty or cannot be parsed.
  MALFORMED_DATA = 1004;
  // The chain has already been initialized during genesis and cannot be
  // re-initialized.
  CHAIN_ALREADY_INITIALIZED = 1005;
  // No signatures were provided.
  MISSING_SIGNATURES = 1006;
  // The transaction contains too many signatures.
  TOO_MANY_SIGNATURES = 1007;
  // The account is invalid.
  INVALID_ACCOUNT = 1009;
  // The signature failed all supported verification methods.
  SIGNATURE_VERIFICATION_FAILED = 1010;
  // Duplicate signer detected.
  DUPLICATE_SIGNER = 1012;
  // The transaction target address is invalid.
  INVALID_TARGET_ADDRESS = 1013;
  // The transaction message is too large.
  MESSAGE_TOO_LARGE = 1014;
  // Permission configuration is missing, so the authorization check cannot be
  // completed.
  MISSING_PERMISSION_CONFIG = 1015;
  // The signature contains an unrecognized signer address.
  UNRECOGNIZED_SIGNER_ADDRESS = 1016;
  // The signature threshold is not met, or the caller does not have sufficient
  // permission to access this resource.
  INSUFFICIENT_SIGNATURE_THRESHOLD_OR_PERMISSION = 1017;
  // The target address is not included in the signers.
  TARGET_ADDRESS_NOT_IN_SIGNERS = 1018;
  // Duplicate proposer found in the proposers list.
  DUPLICATE_PROPOSER = 1019;
  // The total proposer weight is less than the required threshold.
  TOTAL_PROPOSER_WEIGHT_BELOW_THRESHOLD = 1020;
  // The length of the proposers list does not match the length of the weights
  // list.
  PROPOSERS_AND_WEIGHTS_LENGTH_MISMATCH = 1021;
  // Multi-signature verification failed.
  MULTISIG_VERIFICATION_FAILED = 1022;
  // The signature type is ambiguous and cannot be determined as agent, regular
  // account or multi-signature.
  SIGNATURE_TYPE_AMBIGUOUS = 1023;
  // The permission domain is invalid.
  INVALID_PERMISSION_DOMAIN = 1024;
  reserved 1025 to 1050;

  // The action type is not supported.
  UNSUPPORTED_ACTION_TYPE = 1051;
  // The token is already registered.
  TOKEN_ALREADY_REGISTERED = 1052;
  // The token decimal precision exceeds the allowed limit.
  TOKEN_DECIMALS_TOO_LARGE = 1053;
  // The specified token does not exist.
  TOKEN_NOT_FOUND = 1054;
  // The decimal value is malformed and cannot be parsed.
  MALFORMED_DECIMAL_VALUE = 1055;
  // The value must be greater than zero.
  POSITIVE_VALUE_REQUIRED = 1056;
  // Amount precision exceeds the allowed limit of {0} decimal places.
  AMOUNT_DECIMALS_TOO_LARGE = 1057;
  // Deposits for this token are not enabled on the selected chain.
  DEPOSIT_NOT_AVAILABLE = 1058;
  // Invalid chain ID.
  INVALID_CHAIN_ID = 1059;
  // No proposers are specified.
  PROPOSERS_CANNOT_BE_EMPTY = 1060;
  // The chain is already registered.
  CHAIN_ALREADY_REGISTERED = 1061;
  // The chain is not registered.
  CHAIN_NOT_REGISTERED = 1062;
  // The idempotency key has already been used.
  IDEMPOTENCY_KEY_ALREADY_USED = 1063;
  // The base token and quote token cannot be the same.
  BASE_AND_QUOTE_TOKEN_CANNOT_BE_SAME = 1064;
  // Price limit bound must be in (0, 1); the conditional price limit bound
  // must not be less than the price limit bound.
  INVALID_PRICE_LIMIT_BOUND = 1065;
  // The leverage value is invalid.
  INVALID_LEVERAGE = 1066;
  // The maintenance margin rate (MMR) is invalid.
  INVALID_MMR = 1067;
  // Risk limit range is required.
  MISSING_RANGE = 1068;
  // The lower bound of the range is invalid.
  INVALID_RANGE_LOWER = 1069;
  // The upper bound of the range is invalid.
  INVALID_RANGE_UPPER = 1070;
  // The risk limit configuration is invalid.
  INVALID_RISK_LIMITS = 1071;
  // The symbol is already registered.
  SYMBOL_ALREADY_REGISTERED = 1072;
  // The funding rate bound is invalid.
  INVALID_FUNDING_RATE_BOUND = 1073;
  // The first fee tier level must be 0.
  FIRST_FEE_TIER_MUST_ZERO = 1074;
  // Fee tier levels must be continuous.
  FEE_TIER_MUST_CONTINUOUS = 1075;
  // The fee tier level exceeds the allowed maximum.
  FEE_TIER_LEVEL_TOO_LARGE = 1077;
  // At least one fee tier is required.
  FEE_TIERS_CANNOT_EMPTY = 1078;
  // The specified fee tier was not found.
  FEE_TIER_NOT_FOUND = 1079;
  // The maximum number of agent wallets has been exceeded.
  MAX_AGENTS_EXCEEDED = 1082;
  // The agent wallet already exists.
  AGENT_ALREADY_EXISTS = 1083;
  // The agent name exceeds the maximum allowed length.
  AGENT_NAME_MAX_LENGTH_EXCEEDED = 1085;
  // The agent wallet expiration time exceeds the maximum allowed value.
  MAX_VALID_TIME_EXCEEDED = 1086;
  // The agent name is required.
  AGENT_NAME_REQUIRED = 1087;
  // The default leverage value is invalid.
  INVALID_DEFAULT_LEVERAGE = 1088;
  // The trigger price is invalid: it cannot be parsed or is less than or equal
  // to zero.
  INVALID_TRIGGER_PRICE = 1089;
  // The post-trigger order type is not supported. Only limit and market orders
  // are allowed.
  UNSUPPORTED_POST_TRIGGER_ORDER_TYPE = 1090;
  // A trigger limit order must include a limit price.
  TRIGGER_LIMIT_ORDER_MISSING_LIMIT_PRICE = 1091;
  // A trigger market order cannot include a limit price.
  TRIGGER_MARKET_ORDER_CANNOT_HAVE_LIMIT_PRICE = 1092;
  // The trigger direction is invalid.
  INVALID_TRIGGER_DIRECTION = 1093;
  // Trigger parameters are missing.
  MISSING_TRIGGER_PARAMS = 1094;
  // Take-profit or stop-loss parameters are missing.
  MISSING_TP_OR_SL_PARAMS = 1095;
  // The trigger price type is invalid.
  INVALID_TRIGGER_PRICE_TYPE = 1096;
  // The activation price is invalid.
  INVALID_ACTIVATION_PRICE = 1097;
  // The trailing delta type is invalid.
  INVALID_ORDER_TRAILING_DELTA_TYPE = 1099;
  // The trailing delta is invalid.
  INVALID_TRAILING_DELTA = 1100;
  // The order action is invalid.
  INVALID_ORDER_ACTION = 1101;
  // The order type is invalid.
  INVALID_ORDER_TYPE = 1102;
  // The order time-in-force value is invalid.
  INVALID_ORDER_TIME_IN_FORCE = 1103;
  // The client order ID exceeds the maximum length of 16 bytes.
  INVALID_CLIENT_ORDER_ID = 1104;
  // The symbol was not found.
  SYMBOL_NOT_FOUND = 1105;
  // The symbol is not yet open for trading (opens at {0}).
  SYMBOL_NOT_OPEN = 1106;
  // The symbol has been closed. This operation is not allowed.
  SYMBOL_ALREADY_CLOSED = 1107;
  // Insufficient balance or margin to perform the requested operation.
  INSUFFICIENT_MARGIN = 1108;
  // Active orders reached the per-symbol limit ({0}/{1}).
  ORDER_COUNT_LIMIT_EXCEEDED = 1109;
  // Post-only order would take liquidity at {0}.
  POST_ONLY_WOULD_TAKE = 1110;
  // FOK order cannot be fully filled.
  FOK_CANNOT_FILL = 1111;
  // The order would match too many counter orders (limit {0}). Please reduce
  // the order size.
  MATCH_LIMIT_EXCEEDED = 1112;
  // No position available to reduce. Please open a position before performing a
  // reduce-only action.
  NO_POSITION_TO_REDUCE = 1114;
  // A better-priced reduce-only order already exists.
  REDUCE_ONLY_PRICE_NOT_BETTER = 1115;
  // A duplicate client order ID already exists.
  DUPLICATE_CLIENT_ORDER_ID = 1116;
  // Order price violates the allowed range (limit {0}).
  PRICE_OUT_OF_RESTRICTED_RANGE = 1117;
  // The price is invalid.
  INVALID_PRICE = 1119;
  // The size is invalid.
  INVALID_SIZE = 1120;
  // Price precision exceeds the allowed limit of {0} decimal places.
  PRICE_DECIMALS_TOO_LARGE = 1121;
  // The price does not match the tick size {0}.
  TICK_SIZE_CONDITION_MISMATCH = 1122;
  // Size precision exceeds the allowed limit of {0} decimal places.
  SIZE_DECIMALS_TOO_LARGE = 1123;
  // The size is below the minimum allowed value of {0}.
  SIZE_TOO_SMALL = 1124;
  // The size does not match the lot size {0}.
  LOT_SIZE_CONDITION_MISMATCH = 1125;
  // The position mode is invalid.
  INVALID_POSITION_MODE = 1126;
  // Market orders must not set a price.
  MARKET_ORDER_SHOULD_NOT_SET_PRICE = 1127;
  // No trade price is available.
  NO_TRADE_PRICE = 1128;
  // Trailing order parameters are missing.
  MISSING_TRAILING_PARAMS = 1129;
  // The risk limits ID is invalid.
  INVALID_RISK_LIMITS_ID = 1130;
  // The risk limits ID was not found.
